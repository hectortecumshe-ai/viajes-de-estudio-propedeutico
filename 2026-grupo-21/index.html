async function guardarRespaldo() {
  aviso("Preparando respaldo…");
  const fotos = [];
  for (const f of await BD.fotos()) {
    const b64 = await new Promise((res) => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(f.blob); });
    fotos.push({ ...f, blob: undefined, datos: b64 });
  }
  const datos = JSON.stringify({ app: V.slug, version: 1, fecha: new Date().toISOString(), kv: await BD.todo(), fotos });
  await entregar(new Blob([datos], { type: "application/json" }), `respaldo-cuaderno-${V.slug}-${hoyISO()}.json`);
}
async function abrirRespaldo(archivo) {
  try {
    const r = JSON.parse(await archivo.text());
    if (r.app !== V.slug) throw new Error("Ese archivo no es un respaldo de esta guía.");
    if (!(await confirmar("Restaurar respaldo", `<p>Se agregarán las notas y fotos del respaldo del ${esc(new Date(r.fecha).toLocaleDateString("es-MX"))}. Lo que tenga el mismo sitio se reemplaza.</p>`, "Restaurar"))) return;
    for (const [k, v] of r.kv) await BD.set(k, v);
    for (const f of r.fotos) { const blob = await (await fetch(f.datos)).blob(); await BD.ponerFoto({ ...f, datos: undefined, blob }); }
    aviso("Respaldo restaurado");
    renderCuaderno();
  } catch (e) { aviso(e.message || "No se pudo leer el respaldo."); }
}

      </div>
      <label class="campo"><span>Dirección actual en la UACh</span><input data-c="direccion" value="${val("direccion")}"></label>
      <label class="campo"><span>Medicamentos que estás tomando (se declara al reverso)</span><textarea data-c="medicamentos" rows="2">${val("medicamentos")}</textarea></label>
      <div class="campo"><span>Firma (con el dedo)</span><canvas class="firma" id="firma" width="800" height="240" aria-label="Área para firmar"></canvas>
        <div class="botones"><button class="btn" id="firma-borrar" type="button">Borrar firma</button></div></div>
      <div class="aviso" id="carta-faltan" hidden></div>
      <div class="botones"><button class="btn prim" id="carta-word">⬇ Descargar mi carta para imprimir (Word)</button><button class="btn" id="carta-blanco">Carta en blanco para llenar a mano</button></div>
      <p class="pie">Imprímela, fírmala con tinta y entrégala a tu profesor antes del viaje. Si la firmaste en el teléfono, la firma aparece impresa; aun así fírmala a mano.</p>
    </section>
    <section aria-labelledby="t-asp"><h2 id="t-asp" style="font-size:1.2rem">Aspectos a tomar en cuenta</h2>
      <div class="tabla-wrap"><table><tbody>${D.aspectos.map(([t, x]) => `<tr><th style="width:32%">${esc(t)}</th><td>${esc(x)}</td></tr>`).join("")}</tbody></table></div></section>
    <section class="tarjeta" aria-labelledby="t-llevar"><h2 id="t-llevar" style="font-size:1.2rem">Qué llevar</h2>
      <ul class="checks">${D.llevar.map((x, i) => `<li><label><input type="checkbox" data-ll="llevar:${i}"><span>${esc(x)}</span></label></li>`).join("")}</ul></section>
    <section class="tarjeta" aria-labelledby="t-libro"><h2 id="t-libro" style="font-size:1.2rem">El libro del viaje</h2>
      <p style="font-size:.95rem">Los nueve reportes diarios formarán un libro. Cada capítulo lo firman como autores los estudiantes responsables de ese día; los profesores ${V.profesores.map((p) => esc(p.nombre)).join(" y ")} coordinan la obra y son coautores.</p>
      <h3 style="font-size:1.05rem">Estructura de cada capítulo</h3>
      <ol class="preguntas">${D.estructura.map(([t, x]) => `<li><b>${esc(t)}.</b> ${esc(x)}</li>`).join("")}</ol>
      <h3 style="font-size:1.05rem">Partes del libro completo</h3>
      <div class="libro">${D.libro.map(([t, xs]) => `<div><b>${esc(t)}</b><ul>${xs.map((x) => `<li>${esc(x)}</li>`).join("")}</ul></div>`).join("")}</div>
      <p class="pie">Cómo citar un capítulo: Autores del día (2026). Día n. Título del capítulo. En ${V.profesores.map((p) => esc(p.cita)).join(" y ")} (Coords.), ${esc(V.titulo)}. ${esc(V.universidad)}.</p></section>
    ${$("#tpl-ratio").innerHTML}
    <section aria-labelledby="t-inst"><h2 id="t-inst" style="font-size:1.2rem">Instalar en el teléfono</h2>
      <p style="font-size:.95rem">Abre el menú del navegador y elige «Agregar a pantalla de inicio» o «Instalar app». Quedará con el escudo de la Universidad y abrirá sin internet.</p>
      <p class="pie">${esc(V.universidad)} · ${esc(V.sede)} · ${esc(V.asignatura)} · ${esc(V.ciclo)}</p></section>
    <section aria-labelledby="t-cred"><h2 id="t-cred" style="font-size:1.2rem">Créditos</h2>
      <p style="font-size:.95rem"><b>Autor de la guía de viaje de estudio:</b> ${esc(V.autor_guia.nombre)}, ${esc(V.autor_guia.adscripcion)}.</p>
      <p style="font-size:.95rem"><b>Profesores del viaje:</b> ${V.profesores.map((p) => `${esc(p.nombre)} (${esc(p.papel.toLowerCase())})`).join(" y ")}.</p>
      <p class="pie">Clima: normales climatológicas del Servicio Meteorológico Nacional (CONAGUA) y clasificación de Köppen modificada por E. García (2004). Relieve: SRTM. Rutas: OpenStreetMap.</p></section>`;
  for (let i = 0; i < D.llevar.length; i++) { const el = $(`[data-ll="llevar:${i}"]`); el.checked = !!(await BD.get("llevar:" + i)); }
  // guardar campos de la carta
  sec.oninput = sec.onchange = (e) => {
    const k = e.target.dataset.c; if (!k) return;
    carta[k] = e.target.value; guardarCarta();
  };
  iniciarFirma(c.firma);
  $("#carta-word").onclick = async () => {
    const faltan = [["nombre", "tu nombre"], ["matricula", "tu matrícula"], ["fecha", "la fecha"], ["c1_nombre", "el nombre del contacto de emergencia 1"],
      ["c1_telefono", "el teléfono del contacto de emergencia 1"], ["sangre", "tu tipo de sangre"]].filter(([k]) => !String(carta[k] || "").trim()).map(([, t]) => t);
    if (!carta.firma) faltan.push("tu firma");
    const caja = $("#carta-faltan");
    if (faltan.length) {
      caja.hidden = false;
      caja.innerHTML = `<b>Falta llenar</b><span>${esc(faltan.join(", "))}.</span><span class="gris" style="font-size:.85rem">Puedes descargarla así y completarla a mano.</span>`;
      if (!(await confirmar("Faltan datos", `<p>Falta: ${esc(faltan.join(", "))}.</p><p>¿Descargarla de todos modos?</p>`, "Descargar"))) return;
    } else caja.hidden = true;
    exportarCarta(false);
  };
  $("#carta-blanco").onclick = () => exportarCarta(true);
}
function textoCarta(nombre, matricula) {
  return [
    `EL QUE SUSCRIBE ${nombre}, ESTUDIANTE DE NIVEL PROPEDÉUTICO, DEL GRUPO ACADÉMICO 21, CON NÚMERO DE MATRÍCULA ${matricula}, POR ESTE CONDUCTO ME COMPROMETO A ASUMIR CON TOTAL RESPONSABILIDAD LAS ACTIVIDADES ACADÉMICAS PROGRAMADAS PARA LA REALIZACIÓN DEL VIAJE DE ESTUDIO INTEGRADOR I, QUE SE REALIZARÁ DEL JUEVES 26 DE NOVIEMBRE AL VIERNES 04 DE DICIEMBRE DEL PRESENTE AÑO EN LA RUTA CAR HUATUSCO – VERACRUZ, PUEBLA, TLAXCALA – CIUDAD DE MÉXICO, ANEXAS Y RETORNO A CAR HUATUSCO.`,
    "ASUMO LA TOTAL RESPONSABILIDAD DE MIS ACTOS EN DICHO VIAJE EN TODAS LAS ACTIVIDADES QUE SEAN REALIZADAS, ASÍ COMO OBSERVAR LA NORMATIVIDAD UNIVERSITARIA DE LA UNIVERSIDAD AUTÓNOMA CHAPINGO.",
    `POR ESTE MEDIO EXIMO DE CUALQUIER RESPONSABILIDAD DE MIS ACTOS A LOS PROFESORES DEL VIAJE: ${V.profesores.map((p) => p.nombre).join(" Y ")}.`,
    "MANIFIESTO CONOCER MIS OBLIGACIONES COMO ESTUDIANTE DE LA UNIVERSIDAD AUTÓNOMA CHAPINGO, DE CONFORMIDAD CON EL REGLAMENTO ACADÉMICO VIGENTE Y EL REGLAMENTO DE VIAJES DE ESTUDIOS. EN CASO DE SER REGRESADO DEL VIAJE POR INCUMPLIMIENTO DE MIS OBLIGACIONES, ES BAJO MI TOTAL RESPONSABILIDAD. ADEMÁS, ASUMO EL COMPROMISO DE ASISTIR CON ROPA DE TRABAJO, CONOCIMIENTO DE LA ORGANIZACIÓN DEL VIAJE, PRESENTABLE, CREDENCIAL VIGENTE DE LA UNIVERSIDAD AUTÓNOMA CHAPINGO, CARNET DEL IMSS, ASÍ COMO LOS MATERIALES QUE SE REQUIEREN PARA LA REALIZACIÓN DEL VIAJE. MANIFIESTO NO TENER IMPEDIMENTO FÍSICO NI DE SALUD PARA REALIZAR EL VIAJE ANTES SEÑALADO (*).",
  ];
}
let firmaCanvas = null, firmaHecha = false;
function iniciarFirma(guardada) {
  const cv = $("#firma"), ctx = cv.getContext("2d");
  firmaCanvas = cv; firmaHecha = false;
  ctx.lineWidth = 3.2; ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.strokeStyle = "#1a2a6c";
  if (guardada) { const i = new Image(); i.onload = () => ctx.drawImage(i, 0, 0, cv.width, cv.height); i.src = guardada; firmaHecha = true; }
  let dibujando = false;
  const punto = (e) => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * cv.width / r.width, (e.clientY - r.top) * cv.height / r.height]; };
  cv.onpointerdown = (e) => { dibujando = true; cv.setPointerCapture(e.pointerId); ctx.beginPath(); ctx.moveTo(...punto(e)); };
  cv.onpointermove = (e) => { if (!dibujando) return; ctx.lineTo(...punto(e)); ctx.stroke(); firmaHecha = true; };
  cv.onpointerup = cv.onpointercancel = () => {
    if (!dibujando) return; dibujando = false;
    carta.firma = cv.toDataURL("image/png"); guardarCarta();
  };
  $("#firma-borrar").onclick = () => { ctx.clearRect(0, 0, cv.width, cv.height); firmaHecha = false; delete carta.firma; guardarCarta(); };
}
async function exportarCarta(enBlanco) {
  const c = enBlanco ? {} : { ...(carta || (await BD.get("carta")) || {}) };
  const linea = "______________________________";
  const v = (k) => (c[k] && String(c[k]).trim()) || linea;
  const fechaTxt = (iso) => (iso ? new Date(iso + "T12:00").toLocaleDateString("es-MX", { day: "numeric", month: "long", year: "numeric" }) : linea);
  const b = [
    { centro: "UNIVERSIDAD AUTÓNOMA CHAPINGO", b: true, tam: 13 },
    { centro: "DEPARTAMENTO DE PREPARATORIA AGRÍCOLA", b: true },
    { centro: V.sede.toUpperCase() },
    { p: "FECHA: " + (c.fecha ? fechaTxt(c.fecha) : linea), jc: "right" },
    { p: "A QUIEN CORRESPONDA:", b: true, jc: "left" },
    ...textoCarta(v("nombre"), v("matricula")).map((p) => ({ p })),
    { p: "EN CASO DE EMERGENCIA NOTIFICAR A LAS SIGUIENTES DOS PERSONAS (PADRE Y/O FAMILIARES DIRECTOS):", b: true },
  ];
  for (const i of [1, 2]) {
    b.push({ campos: [["NOMBRE", c[`c${i}_nombre`]], ["PARENTESCO", c[`c${i}_parentesco`]],
      ["DOMICILIO", [c[`c${i}_calle`], c[`c${i}_numero`] && "Nº " + c[`c${i}_numero`], c[`c${i}_colonia`] && "Col. " + c[`c${i}_colonia`], c[`c${i}_ciudad`], c[`c${i}_estado`], c[`c${i}_cp`] && "C.P. " + c[`c${i}_cp`]].filter(Boolean).join(", ")],
      ["TELÉFONO", c[`c${i}_telefono`]]] });
  }
  b.push({ centro: "A T E N T A M E N T E", b: true });
  if (!enBlanco && c.firma) {
    const datos = Uint8Array.from(atob(c.firma.split(",")[1]), (ch) => ch.charCodeAt(0));
    b.push({ img: datos, ext: "png", ancho: 800, alto: 240, cm: 4.5 });
  } else b.push({ centro: "\n\n_______________________________________" });
  b.push({ centro: "FIRMA" }, { centro: enBlanco ? "" : v("nombre") },
         { campos: [["FECHA DE NACIMIENTO", c.nacimiento ? fechaTxt(c.nacimiento) : ""], ["LUGAR DE ORIGEN (COMUNIDAD, MUNICIPIO Y ESTADO)", c.origen], ["TIPO DE SANGRE", c.sangre], ["DIRECCIÓN ACTUAL EN LA UACh", c.direccion]] },
         { nota: "(*) Declarar al reverso si están recibiendo algún medicamento." },
         { salto: true }, { p: "REVERSO · MEDICAMENTOS QUE ESTOY RECIBIENDO", b: true, jc: "left" },
         { p: (!enBlanco && c.medicamentos) || "Ninguno / ______________________________________________" });
  await entregar(Docx.crear(b, { tam: 10, interlineado: 232, despues: 48, margen: 950 }), enBlanco ? "carta-responsiva-viaje-integrador-I-en-blanco.docx" : `carta-responsiva-${nombreArchivo(c.nombre || "estudiante")}.docx`);
}

// ------------------------------------------------------------------ arranque
navegar();
})();

</script>
<script>
(function () {
  function poner(t, ok) { window.ESTADO_RED = t; var e = document.getElementById("estado-red"); if (e) { e.textContent = t; e.classList.toggle("ok", !!ok); } }
  if (!("serviceWorker" in navigator)) { poner("Este navegador no guarda la guía; usa el archivo de respaldo."); return; }
  navigator.serviceWorker.register("sw.js").then(function () { return navigator.serviceWorker.ready; })
    .then(function () { poner("Lista para usar sin internet en este teléfono.", true); })
    .catch(function () { poner("No se pudo guardar la guía; usa el archivo de respaldo."); });
})();
</script>
