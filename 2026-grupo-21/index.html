<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="author" content="Héctor Tecumshé Mojica Zárate">
<meta name="theme-color" content="#1f4a35">
<title>Viaje Generacional 21</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icono-192.png" type="image/png">
<link rel="apple-touch-icon" href="icono-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex">
<style>
/* Layout: app de una columna tipo cuaderno de campo; barra inferior con cinco secciones; cada día es una libreta de sitios */
:root {
  --papel: #f3eee2;
  --hoja: #fffcf5;
  --tinta: #1e2a23;
  --gris: #5d6459;
  --linea: #e2d9c6;
  --verde: #1f4a35;
  --verde-2: #2f6b4f;
  --trigo: #9a6d14;
  --trigo-suave: #f3e6c8;
  --rojo: #a63d24;
  --renglon: #cfdbe6;
  --margen: #e3a49b;
  --lluvia: #2a6f9c;
  --calor: #b23a2f;
  --sombra: 0 1px 2px rgb(40 30 10 / .08), 0 6px 18px rgb(40 30 10 / .06);
  --serif: "Palatino Linotype", Palatino, "Book Antiqua", "URW Palladio L", P052, Georgia, serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --papel: #121612; --hoja: #1a201b; --tinta: #ece7da; --gris: #a9ad9f; --linea: #2e362f; --verde: #93c9a6; --verde-2: #6fb08a;
  --trigo: #e0b55a; --trigo-suave: #2c2617; --rojo: #e58a6c; --renglon: #2a3542; --margen: #6a3a33;
  --lluvia: #6fb3e0; --calor: #f08a73;
  --sombra: 0 1px 2px rgb(0 0 0 / .4); color-scheme: dark } }
:root[data-theme="dark"] {
  --papel: #121612; --hoja: #1a201b; --tinta: #ece7da; --gris: #a9ad9f; --linea: #2e362f; --verde: #93c9a6; --verde-2: #6fb08a;
  --trigo: #e0b55a; --trigo-suave: #2c2617; --rojo: #e58a6c; --renglon: #2a3542; --margen: #6a3a33;
  --lluvia: #6fb3e0; --calor: #f08a73;
  --sombra: 0 1px 2px rgb(0 0 0 / .4); color-scheme: dark }
.clima { display: grid; gap: 8px }
.formula { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline }
.formula b { font-size: 1.25rem; letter-spacing: .02em; color: var(--verde) }
svg.climograma { display: block; width: 100%; height: auto }
.clima table { font-size: .78rem } .clima th, .clima td { padding: 3px 5px }
.credito { font-size: .95rem; color: var(--gris) } .credito b { color: var(--tinta) }
.gps { display: grid; gap: 8px }
.leyenda-veg { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .82rem; color: var(--gris) }
.leyenda-veg span { display: inline-flex; gap: 6px; align-items: center } .leyenda-veg i { width: 14px; height: 10px; border-radius: 3px; opacity: .8 }
.agro-lista { display: grid; gap: 4px }
.agro-dia summary h4 { display: flex; gap: 8px; align-items: center } .agro-dia .pt { width: 11px; height: 11px; border-radius: 50%; flex: none }
.lista-agro { margin: 0; padding-left: 1.1em; display: grid; gap: 3px }
:root { --linea-ratio: var(--linea); --acento-ratio: var(--trigo) }
.ratio-sec .doi-ratio { color: var(--gris) }

.ratio-sec { display: grid; gap: 12px }
.familia-ratio { display: grid; gap: 6px; border-top: 1px solid var(--linea-ratio, rgb(127 127 127 / .3)); padding-top: 12px }
.familia-ratio h3 { margin: 0 }
.lema-ratio { font-style: italic; opacity: .8 }
.apps-ratio { margin: 0; padding-left: 1.1em; display: grid; gap: 6px }
.doi-ratio { font-size: .78em; white-space: nowrap; opacity: .8 }
.resiliencia-ratio { border-left: 4px solid var(--acento-ratio, currentColor); padding: 6px 0 6px 12px; font-style: italic }
.qrs-ratio { display: flex; flex-wrap: wrap; gap: 18px; justify-content: center }
.qrs-ratio figure { margin: 0; display: grid; gap: 6px; justify-items: center; text-align: center; font-size: .9rem }
.qrs-ratio svg.qr-ratio { width: 132px; height: 132px; border-radius: 10px; border: 1px solid rgb(127 127 127 / .3); background: #fff; padding: 4px }

.hud { position: absolute; left: 10px; right: 10px; bottom: 10px; z-index: 2; display: grid; gap: 5px; background: color-mix(in srgb, var(--hoja) 92%, transparent);
  border: 1px solid var(--linea); border-left: 4px solid #1d4f9c; border-radius: 12px; padding: 9px 12px; font-size: .9rem; backdrop-filter: blur(6px) }
.hud-fila { display: flex; flex-wrap: wrap; gap: 3px 12px; align-items: baseline } .hud-fila b { font-size: 1.05rem }
.hud .barra-t { height: 6px; border-radius: 3px; background: var(--linea); overflow: hidden } .hud .barra-t i { display: block; height: 100%; width: 0; background: #e7b416 }
.etiqueta-bus i { background: #1d4f9c !important; font-size: .7rem }
.gps-info { display: grid; gap: 3px; background: var(--hoja); border: 1px solid var(--linea); border-left: 4px solid #d63a2f; border-radius: 10px; padding: 10px 12px; font-size: .92rem }
.etiqueta-yo i { background: #d63a2f }
.qr-guia { display: flex; gap: 12px; align-items: center; margin-top: 6px } .qr-guia svg { width: 104px; height: 104px; flex: none; background: #fff; border-radius: 8px; padding: 3px; border: 1px solid var(--linea) }
.autores-ed { margin: 0; padding-left: 1.4em; list-style: decimal; display: grid; gap: 6px }
.autores-ed li { display: flex; align-items: center; gap: 6px } .autores-ed li span { flex: 1; min-width: 0 }
.btn.mini { padding: 2px 9px; font-size: .85rem }
.btn:disabled { opacity: .4; cursor: default }
.libro { display: grid; gap: 10px } .libro ul { margin: 4px 0 0; padding-left: 1.2em; font-size: .93rem }

* { box-sizing: border-box }
html { -webkit-text-size-adjust: 100% }
body { margin: 0; background: var(--papel); color: var(--tinta); font: 17px/1.55 var(--serif); padding-inline: 16px;
  padding-block: env(safe-area-inset-top, 0px) calc(84px + env(safe-area-inset-bottom, 0px)) }
img { max-width: 100% }
[hidden] { display: none !important }
h1, h2, h3, h4 { font-family: var(--serif); margin: 0; line-height: 1.15; text-wrap: balance; font-weight: 700 }
h1 { font-size: clamp(1.9rem, 8vw, 2.7rem); letter-spacing: -.01em }
h2 { font-size: 1.45rem }
h3 { font-size: 1.18rem }
h4 { font-size: 1rem }
p { margin: 0 }
a { color: var(--verde-2) }
button, input, select, textarea { font: inherit; color: inherit }
.num { font-variant-numeric: tabular-nums lining-nums }
.versalita { font-variant: small-caps; letter-spacing: .06em; text-transform: lowercase; font-size: 1.02rem; color: var(--trigo); font-weight: 700 }
.gris { color: var(--gris) }
main { max-width: 760px; margin: 0 auto }
.vista { display: grid; gap: 26px; padding-block: 18px 12px }
section { display: grid; gap: 12px; min-width: 0 }

/* portada */
.portada { display: grid; gap: 16px; padding-top: 10px }
.sello { display: grid; grid-template-columns: 74px 1fr; gap: 14px; align-items: center }
.sello img { width: 74px; height: 74px; object-fit: contain; background: #fff; border-radius: 50%; padding: 4px; box-shadow: var(--sombra) }
.sello b { display: block; font-size: 1.02rem }
.sello span { font-size: .9rem; color: var(--gris) }
.filete { height: 0; border-top: 1px solid var(--linea); border-bottom: 3px double var(--linea); margin-block: 2px }
.lema { font-style: italic; color: var(--gris); font-size: .95rem }
.cifras { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px }
.cifra { border-top: 2px solid var(--verde); padding-top: 6px }
.cifra b { display: block; font-size: 1.5rem; font-variant-numeric: lining-nums tabular-nums }
.cifra span { font-size: .85rem; color: var(--gris) }
.profes { display: grid; gap: 2px; font-size: .95rem }

.tarjeta { background: var(--hoja); border: 1px solid var(--linea); border-radius: 14px; padding: 16px; box-shadow: var(--sombra); display: grid; gap: 12px; min-width: 0 }
.aviso { background: var(--trigo-suave); border-radius: 12px; padding: 12px 14px; display: grid; gap: 4px; font-size: .95rem }
.aviso b { color: var(--trigo) }
.estado-red::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--trigo); margin-right: 8px }
.estado-red.ok::before { background: var(--verde-2) }

/* mapas y perfiles */
.figura { border-radius: 14px; overflow: hidden; border: 1px solid var(--linea); background: var(--hoja); box-shadow: var(--sombra) }
.mapa3d { position: relative; height: min(72vh, 520px); touch-action: none }
.mapa3d canvas { display: block; width: 100%; height: 100% }
.capa-etiquetas { position: absolute; inset: 0; pointer-events: none; overflow: hidden }
.etiqueta-3d { position: absolute; left: 0; top: 0; pointer-events: auto; display: flex; gap: 6px; align-items: center; background: var(--hoja);
  color: var(--tinta); border: 1px solid var(--linea); border-radius: 999px; padding: 2px 9px 2px 2px; font: 600 .74rem var(--serif); white-space: nowrap; cursor: pointer;
  box-shadow: 0 1px 4px rgb(0 0 0 / .2) }
.etiqueta-3d i { font-style: normal; width: 19px; height: 19px; border-radius: 50%; color: #fff; display: grid; place-items: center; font-size: .7rem; font-weight: 800 }
.sin-3d { padding: 24px; color: var(--gris) }
.desliza { overflow-x: auto; -webkit-overflow-scrolling: touch }
.mapa { display: block; width: 100%; height: auto; min-width: 680px }
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px }
.chips::-webkit-scrollbar { display: none }
.chip { flex: none; border: 1px solid var(--linea); background: var(--hoja); border-radius: 999px; padding: 5px 12px; font-size: .88rem; cursor: pointer; display: inline-flex; gap: 6px; align-items: center }
.chip[aria-pressed="true"] { background: var(--verde); color: var(--hoja); border-color: var(--verde) }
.chip .pt { width: 10px; height: 10px; border-radius: 50% }
.pie { font-size: .82rem; color: var(--gris) }
svg.perfil { display: block; width: 100%; height: auto; min-width: 600px }
svg.perfil text { font-family: var(--serif); fill: var(--gris); font-size: 13px }
svg.perfil .rej { stroke: var(--linea) }
svg.perfil .area { opacity: .22 }
svg.perfil .linea { fill: none; stroke-width: 2.4 }
svg.perfil .sitio circle { stroke: var(--hoja); stroke-width: 2.5 }
svg.perfil .sitio text { fill: #fff; font-size: 11px; font-weight: 700 }

/* lista de días */
.dias { display: grid; gap: 10px }
.dia-fila { display: grid; grid-template-columns: 54px 1fr auto; gap: 12px; align-items: center; text-decoration: none; color: inherit;
  background: var(--hoja); border: 1px solid var(--linea); border-radius: 14px; padding: 12px; box-shadow: var(--sombra) }
.dia-fila .dnum { width: 54px; height: 54px; border-radius: 12px; color: #fff; display: grid; place-items: center; text-align: center; line-height: 1 }
.dia-fila .dnum small { display: block; font-size: .62rem; letter-spacing: .1em; text-transform: uppercase }
.dia-fila .dnum b { font-size: 1.5rem }
.dia-fila h3 { font-size: 1.02rem }
.dia-fila p { font-size: .85rem; color: var(--gris) }
.dia-fila .hoy { font-size: .72rem; background: var(--rojo); color: #fff; border-radius: 999px; padding: 1px 8px; margin-left: 6px; vertical-align: 2px }
.flecha { color: var(--gris); font-size: 1.3rem }

/* día */
.dia-cab { display: grid; gap: 8px; border-left: 5px solid var(--color-dia, var(--verde)); padding-left: 14px }
.dia-cab h1 { font-size: clamp(1.6rem, 6.5vw, 2.2rem) }
.datos-dia { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: .9rem; color: var(--gris) }
.datos-dia b { color: var(--tinta) }
.equipo-dia { display: grid; gap: 10px }
.resp { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 8px }
.resp div { border: 1px dashed var(--linea); border-radius: 10px; padding: 10px; font-size: .88rem }
.resp b { display: block; color: var(--verde-2) }
.autores { display: flex; flex-wrap: wrap; gap: 6px }
.autor { background: var(--trigo-suave); border-radius: 999px; padding: 3px 11px; font-size: .88rem }

.linea-tiempo { list-style: none; margin: 0; padding: 0; display: grid }
.lt { display: grid; grid-template-columns: 62px 1fr; gap: 10px; scroll-margin-top: 16px }
.lt-hora { text-align: right; padding-top: 16px; font-size: .9rem; font-weight: 700; font-variant-numeric: lining-nums tabular-nums; line-height: 1.2 }
.lt-hora small { display: block; font-weight: 400; color: var(--gris) }
.lt-cuerpo { border-left: 2px solid var(--linea); padding: 10px 0 16px 14px; position: relative; min-width: 0 }
.lt-cuerpo::before { content: ""; position: absolute; left: -8px; top: 18px; width: 14px; height: 14px; border-radius: 50%; background: var(--papel); border: 2px solid var(--gris) }
.lt.visita .lt-cuerpo { border-left-color: var(--color-dia, var(--verde)) }
.lt.visita .lt-cuerpo::before { background: var(--color-dia, var(--verde)); border-color: var(--color-dia, var(--verde)) }
.lt.servicio .lt-cuerpo::before, .lt.traslado .lt-cuerpo::before { width: 10px; height: 10px; left: -6px; top: 20px }
.lt.extra .lt-cuerpo::before { background: var(--trigo); border-color: var(--trigo) }
.sitio-cab { display: grid; gap: 4px }
.sitio-cab .lugar { font-size: .88rem; color: var(--gris) }
.insignias { display: flex; flex-wrap: wrap; gap: 6px; font-size: .8rem }
.insignia { border: 1px solid var(--linea); border-radius: 999px; padding: 1px 9px; background: var(--papel) }
.insignia.costo { border-color: var(--trigo); color: var(--trigo); border-radius: 8px; background: var(--trigo-suave) }
.actividad { font-size: .96rem }
.insignia.alt { font-variant-numeric: lining-nums }
.servicio-txt { font-size: .92rem; color: var(--gris) }

details.bloque { border-top: 1px solid var(--linea); padding-top: 8px }
details.bloque > summary { cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center; gap: 8px; padding-block: 2px }
details.bloque > summary::-webkit-details-marker { display: none }
details.bloque > summary::after { content: "+"; font-weight: 700; color: var(--gris); font-size: 1.2rem }
details.bloque[open] > summary::after { content: "−" }
.cuerpo { display: grid; gap: 10px; padding-top: 8px; font-size: .95rem }
dl.ficha { margin: 0; display: grid; gap: 10px }
dl.ficha dt { font-variant: small-caps; text-transform: lowercase; letter-spacing: .05em; color: var(--trigo); font-weight: 700 }
dl.ficha dd { margin: 0 }
.lista-chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 4px }
.lista-chips span { background: var(--papel); border: 1px solid var(--linea); border-radius: 999px; padding: 1px 9px; font-size: .84rem }
ul.checks { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px }
ul.checks label { display: flex; gap: 10px; align-items: flex-start; cursor: pointer }
ul.checks input { margin-top: 4px; width: 18px; height: 18px; accent-color: var(--verde-2); flex: none }
ul.checks input:checked + span { color: var(--gris); text-decoration: line-through }
ol.preguntas { margin: 0; padding-left: 20px; display: grid; gap: 4px }

/* cuaderno */
.cuaderno { background: var(--hoja); border: 1px solid var(--linea); border-radius: 12px; padding: 12px; display: grid; gap: 10px }
.cuaderno-cab { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap }
.guardado { font-size: .78rem; color: var(--gris) }
textarea.hoja { width: 100%; min-height: 220px; resize: vertical; border: 1px solid var(--linea); border-radius: 8px; padding: 2px 12px 2px 44px;
  background-color: var(--hoja); line-height: 30px; font-size: 1rem; background-attachment: local;
  background-image: linear-gradient(90deg, transparent 34px, var(--margen) 34px, var(--margen) 36px, transparent 36px),
    repeating-linear-gradient(to bottom, transparent 0, transparent 29px, var(--renglon) 29px, var(--renglon) 30px) }
textarea.hoja:focus, input:focus, select:focus { outline: 2px solid var(--trigo); outline-offset: 1px }
.campo { display: grid; gap: 4px; font-size: .9rem }
.campo span { color: var(--gris) }
.campo input, .campo select, .campo textarea { border: 1px solid var(--linea); border-radius: 8px; padding: 8px 10px; background: var(--hoja); width: 100%; min-width: 0 }
.fila-campos { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px }
.botones { display: flex; flex-wrap: wrap; gap: 8px }
.btn { border: 1px solid var(--linea); background: var(--hoja); border-radius: 10px; padding: 8px 13px; font-size: .9rem; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; text-decoration: none; color: var(--tinta) }
.btn.prim { background: var(--verde); color: var(--hoja); border-color: var(--verde) }
.btn.acento { border-color: var(--trigo); color: var(--trigo) }
.btn.peligro { color: var(--rojo); border-color: var(--rojo) }
.btn:focus-visible, .chip:focus-visible, a:focus-visible, summary:focus-visible { outline: 3px solid var(--trigo); outline-offset: 2px }
.fotos { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px }
.foto { display: grid; gap: 4px; background: var(--papel); border-radius: 10px; padding: 6px; border: 1px solid var(--linea) }
.foto img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 6px; display: block }
.foto input { border: 0; border-bottom: 1px dashed var(--linea); background: transparent; font-size: .82rem; padding: 2px 0; width: 100% }
.foto button { justify-self: end; border: 0; background: none; color: var(--rojo); font-size: .78rem; cursor: pointer }

/* tablas */
.tabla-wrap { overflow-x: auto; border: 1px solid var(--linea); border-radius: 12px; background: var(--hoja) }
table { border-collapse: collapse; width: 100%; font-size: .9rem }
th, td { padding: 8px 10px; border-bottom: 1px solid var(--linea); text-align: left; vertical-align: top }
th { font-variant: small-caps; text-transform: lowercase; letter-spacing: .04em; color: var(--trigo) }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums lining-nums }
tr:last-child td { border-bottom: 0 }
tfoot td { font-weight: 700 }

/* diálogo */
dialog { border: 0; border-radius: 16px; padding: 20px; max-width: 420px; width: calc(100% - 32px); background: var(--hoja); color: var(--tinta); box-shadow: 0 20px 60px rgb(0 0 0 / .3) }
dialog::backdrop { background: rgb(20 25 20 / .5) }
dialog .botones { justify-content: flex-end; margin-top: 14px }

/* carta */
.carta-txt { font-size: .92rem; text-align: justify; display: grid; gap: 8px }
canvas.firma { width: 100%; height: 160px; background: var(--hoja); border: 1px dashed var(--gris); border-radius: 10px; touch-action: none; display: block }

/* barra inferior */
nav.barra { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--hoja); border-top: 1px solid var(--linea);
  padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px)); display: grid; grid-template-columns: repeat(5, 1fr); box-shadow: 0 -4px 16px rgb(0 0 0 / .06) }
nav.barra a { text-decoration: none; color: var(--gris); display: grid; justify-items: center; gap: 1px; font-size: .74rem; padding: 4px 0; border-radius: 10px }
nav.barra a svg { width: 23px; height: 23px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round }
nav.barra a[aria-current="page"] { color: var(--verde); font-weight: 700 }
.toast { position: fixed; left: 50%; bottom: calc(92px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--tinta); color: var(--papel);
  padding: 9px 16px; border-radius: 999px; font-size: .9rem; z-index: 30; box-shadow: 0 6px 20px rgb(0 0 0 / .25); max-width: calc(100% - 32px) }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth } }
@media (max-width: 420px) { .lt { grid-template-columns: 50px 1fr; gap: 8px } .mapa3d { height: min(70vh, 480px) } }
</style>
</head>
<body>
<main id="app">
  <section class="vista" data-vista="inicio" aria-label="Inicio"></section>
  <section class="vista" data-vista="dias" aria-label="Días" hidden></section>
  <section class="vista" data-vista="dia" aria-label="Día" hidden></section>
  <section class="vista" data-vista="cuaderno" aria-label="Mi cuaderno" hidden></section>
  <section class="vista" data-vista="equipo" aria-label="Equipo" hidden></section>
  <section class="vista" data-vista="mas" aria-label="Más" hidden></section>

  <template id="tpl-ratio"><section class="tarjeta ratio-sec" id="familia-ratio" aria-labelledby="t-ratio"><h2 id="t-ratio">Más allá del viaje: aplicaciones para el campo</h2><p>Lo que observas en este viaje —el saber campesino, la diversidad de cultivos, el agua, el suelo, el clima y los animales— también se puede documentar, medir y planear. La familia Ratio, desarrollada en la Universidad Autónoma Chapingo, reúne aplicaciones libres para el teléfono y la computadora, con instructivos para productores y para científicos y con DOI para citarlas: te sirven para tus cursos, tus prácticas y tu tesis.</p><div class="familia-ratio"><h3>Ratio Complexus</h3><p class="lema-ratio">El saber local como sistema complejo adaptativo</p><p>Una parcela, una comunidad y su territorio son sistemas complejos adaptativos: muchos agentes —familias, plantas, animales, suelos, mercados— interactúan, aprenden y se reorganizan ante sequías, plagas o cambios de precio, y de esas interacciones emerge un orden que nadie dirige. Estas aplicaciones tejen ese conocimiento en una red y lo convierten en indicadores de regeneración, riesgo y sostenibilidad, alineados con los 17 Objetivos de Desarrollo Sostenible. Así apoyan la gestión estratégica integrada de los recursos naturales: decidir qué conservar, qué restaurar y dónde intervenir primero.</p><ul class="apps-ratio"><li><a href="https://hectortecumshe-ai.github.io/RatioTelar/" target="_blank" rel="noopener"><b>Ratio Telar</b></a> — El saber agrícola local como sistema complejo adaptativo: red ponderada, cladograma, regeneración, riesgos, sostenibilidad, ODS y prospectiva, de la región a la localidad. <a class="doi-ratio" href="https://doi.org/10.5281/zenodo.23429007" target="_blank" rel="noopener">DOI 10.5281/zenodo.23429007</a></li><li><a href="https://hectortecumshe-ai.github.io/RatioMilpa/" target="_blank" rel="noopener"><b>Ratio Milpa</b></a> — El conocimiento local del maíz nativo en todo México: 64 razas, un cuestionario para cada localidad y un atlas nacional. <a class="doi-ratio" href="https://doi.org/10.5281/zenodo.23432657" target="_blank" rel="noopener">DOI 10.5281/zenodo.23432657</a></li><li><a href="https://hectortecumshe-ai.github.io/RatioVina/" target="_blank" rel="noopener"><b>Ratio Viña</b></a> — El conocimiento local de la vid: clima vitícola, historial del viñedo, regeneración y riesgo; su instructivo sigue la uva de mesa de Mata de Zarza, Veracruz. <a class="doi-ratio" href="https://doi.org/10.5281/zenodo.23481024" target="_blank" rel="noopener">DOI 10.5281/zenodo.23481024</a></li></ul></div><div class="familia-ratio"><h3>Ratio Nutritio</h3><p class="lema-ratio">Dietas para animales con lo que hay en la región</p><p>Formulan raciones de mínimo costo que cumplen los requerimientos nutricionales de cada etapa y permiten comparar ingredientes locales, costos y, en bovinos, la huella ambiental. Ponen en práctica dos elementos de la agroecología: la eficiencia y el reciclaje de los recursos del propio sistema.</p><ul class="apps-ratio"><li><a href="https://hectortecumshe-ai.github.io/RatioBos/" target="_blank" rel="noopener"><b>Ratio Bos</b></a> — Raciones para bovinos de carne con NASEM (2016), el clima de tu región, programa de engorda y huella ambiental. <a class="doi-ratio" href="https://doi.org/10.5281/zenodo.23197134" target="_blank" rel="noopener">DOI 10.5281/zenodo.23197134</a></li><li><a href="https://hectortecumshe-ai.github.io/RatioAvis/" target="_blank" rel="noopener"><b>Ratio Avis</b></a> — Dietas por fase para pollo de engorda, con ajustes por altitud y calor y certificado de optimalidad. <a class="doi-ratio" href="https://doi.org/10.5281/zenodo.23123050" target="_blank" rel="noopener">DOI 10.5281/zenodo.23123050</a></li><li><a href="https://hectortecumshe-ai.github.io/FormulAves/" target="_blank" rel="noopener"><b>FormulAves</b></a> — La primera de la familia: formular, mezclar y costear la dieta del pollo paso a paso, toda en español. <a class="doi-ratio" href="https://doi.org/10.5281/zenodo.23094626" target="_blank" rel="noopener">DOI 10.5281/zenodo.23094626</a></li></ul></div><p class="resiliencia-ratio">La resiliencia, uno de los diez elementos de la agroecología, no es resistir sin cambiar: es la capacidad de un sistema de absorber una perturbación y reorganizarse sin perder su identidad. La diversidad, las sinergias y el conocimiento compartido que verás en este recorrido son justamente lo que la sostiene, y estas herramientas ayudan a medirla y a cuidarla.</p><div class="qrs-ratio"><figure><svg class="qr-ratio" viewBox="0 0 37 37" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Código QR de https://hectortecumshe-ai.github.io/RatioTelar/" shape-rendering="crispEdges"><rect width="37" height="37" fill="#fff"/><path d="M2,2h1v1h-1zM3,2h1v1h-1zM4,2h1v1h-1zM5,2h1v1h-1zM6,2h1v1h-1zM7,2h1v1h-1zM8,2h1v1h-1zM12,2h1v1h-1zM13,2h1v1h-1zM16,2h1v1h-1zM17,2h1v1h-1zM20,2h1v1h-1zM21,2h1v1h-1zM25,2h1v1h-1zM28,2h1v1h-1zM29,2h1v1h-1zM30,2h1v1h-1zM31,2h1v1h-1zM32,2h1v1h-1zM33,2h1v1h-1zM34,2h1v1h-1zM2,3h1v1h-1zM8,3h1v1h-1zM11,3h1v1h-1zM17,3h1v1h-1zM18,3h1v1h-1zM19,3h1v1h-1zM23,3h1v1h-1zM24,3h1v1h-1zM25,3h1v1h-1zM26,3h1v1h-1zM28,3h1v1h-1zM34,3h1v1h-1zM2,4h1v1h-1zM4,4h1v1h-1zM5,4h1v1h-1zM6,4h1v1h-1zM8,4h1v1h-1zM12,4h1v1h-1zM14,4h1v1h-1zM16,4h1v1h-1zM19,4h1v1h-1zM28,4h1v1h-1zM30,4h1v1h-1zM31,4h1v1h-1zM32,4h1v1h-1zM34,4h1v1h-1zM2,5h1v1h-1zM4,5h1v1h-1zM5,5h1v1h-1zM6,5h1v1h-1zM8,5h1v1h-1zM11,5h1v1h-1zM15,5h1v1h-1zM17,5h1v1h-1zM19,5h1v1h-1zM24,5h1v1h-1zM28,5h1v1h-1zM30,5h1v1h-1zM31,5h1v1h-1zM32,5h1v1h-1zM34,5h1v1h-1zM2,6h1v1h-1zM4,6h1v1h-1zM5,6h1v1h-1zM6,6h1v1h-1zM8,6h1v1h-1zM11,6h1v1h-1zM13,6h1v1h-1zM18,6h1v1h-1zM21,6h1v1h-1zM24,6h1v1h-1zM25,6h1v1h-1zM28,6h1v1h-1zM30,6h1v1h-1zM31,6h1v1h-1zM32,6h1v1h-1zM34,6h1v1h-1zM2,7h1v1h-1zM8,7h1v1h-1zM10,7h1v1h-1zM12,7h1v1h-1zM14,7h1v1h-1zM15,7h1v1h-1zM16,7h1v1h-1zM20,7h1v1h-1zM22,7h1v1h-1zM28,7h1v1h-1zM34,7h1v1h-1zM2,8h1v1h-1zM3,8h1v1h-1zM4,8h1v1h-1zM5,8h1v1h-1zM6,8h1v1h-1zM7,8h1v1h-1zM8,8h1v1h-1zM10,8h1v1 "Ramírez Barranco Belén","Ramos Domingo Jorge Martín","Reyes Machuca Alejandro","Rivera Rivera Jesús Eduardo","Salazar Martínez Alejandro","Salazar Vega Elisa","Tlehuactle Velázquez Ninel","Vásquez Salazar Nahomi","Velasco Salazar Lesly Griselda"],"equipos":{},"responsabilidades":[["Reporte del día","Redactan el capítulo del día para el libro del viaje: notas, fotos, análisis y conclusiones."],["Equipaje del grupo","Organizan, cargan, cuentan y resguardan las maletas de todo el grupo al subir y bajar del autobús."],["Aseo del autobús","Dejan limpio el autobús al terminar el día: basura, pasillos y asientos."]],"aspectos":[["Documentos","Credencial vigente de la UACh, carnet del IMSS, identificación y la carta responsiva firmada y entregada antes de salir."],["Puntualidad","El autobús sale a la hora indicada. Un retraso de una persona se convierte en minutos perdidos para todo el grupo en cada sitio."],["Equipaje","Una maleta y una mochila de día. El equipo responsable del día guarda y cuenta el equipaje del grupo: ten tu maleta marcada con tu nombre."],["Clima extremo en pocos días","Pasaremos de la costa (0 m, más de 28 °C) al Cofre de Perote (más de 3,500 m, heladas bajo 0 °C) y al semidesierto de Tehuacán. Lleva ropa por capas, chamarra, gorro, guantes, sombrero, bloqueador y repelente."],["Para dormir","Sleeping bag o cobija para la casa ejidal de Las Tinajitas y para Chapingo; toalla y artículos de aseo."],["Ropa de trabajo","Pantalón de mezclilla, botas o calzado cerrado; en campo no se usan sandalias. Ropa presentable para museos."],["Salud","Tus medicamentos y receta; avisa a los profesores de alergias o tratamientos (decláralo al reverso de la carta responsiva). Sobre 3,000 m sube despacio, hidrátate y avisa si tienes mareo o dolor de cabeza."],["Respeto","Estamos en ejidos, comunidades y casas de productores: saluda, pide permiso antes de fotografiar personas y agradece. No extraigas plantas, animales, rocas ni fósiles. En Alchichica no se sube a los estromatolitos."],["Dinero","Efectivo para comidas, cuotas de entrada, lanchas y compras: en varios sitios no hay cajero ni pago con tarjeta."],["Bitácora y cuaderno de campo","Lleva siempre tu bitácora de campo y anota en ella, en cada sitio: hora, lugar, quién expone, qué viste, datos y preguntas. Toma fotos con intención (paisaje, suelo, planta, animal, proceso) y describe cada una."],["Normatividad","Durante el viaje rigen el Reglamento Académico y el Reglamento de Viajes de Estudio de la UACh. No se permite el consumo de alcohol ni de sustancias."],["Basura","Lleva una bolsa para tu basura: lo que entra al sitio contigo, sale contigo."],["Fotos en la guía","Las fotos que tomas con «📷 Tomar foto» se guardan solo dentro de la guía y reducidas; en muchos teléfonos no aparecen en la galería. Si quieres la foto original, tómala con la cámara normal y súbela con «🖼 Elegir fotos»."],["Respaldo diario","Al terminar cada día, guarda tu respaldo en «Cuaderno»: si se borran los datos del navegador o pierdes el teléfono, lo que está solo en la guía se pierde."]],"llevar":["Bitácora de campo (libreta de pasta dura), lápiz y bolígrafo: se anota a mano en cada sitio, aunque también uses el cuaderno digital","Credencial UACh y carnet IMSS","Carta responsiva firmada","Celular cargado y batería externa","Lámpara (caminata nocturna en Zapotitlán)","Sleeping bag o cobija","Chamarra, gorro y guantes","Sombrero, bloqueador y repelente","Botella de agua reutilizable","Botas o calzado cerrado","Medicamentos personales","Efectivo","Bolsa para basura","Toalla y artículos de aseo"],"estructura":[["Título del capítulo","Un título que resuma el día, no solo los lugares."],["Autores","Los estudiantes responsables del día, en el orden que acuerde el equipo, con su matrícula; los profesores como coordinadores."],["Resumen y palabras clave","Un párrafo de 150 a 200 palabras con lo esencial del día y de 3 a 5 palabras clave."],["Introducción","Región visitada, por qué es importante y qué se esperaba aprender."],["Objetivo","Qué se buscaba observar y analizar en el día."],["Ruta y sitios","Recorrido, horarios, altitudes, distancias y mapa o perfil del día (la app los da)."],["Desarrollo por sitio","Para cada sitio: condiciones físico-geográficas (relieve, clima con su fórmula y climograma, suelo), flora, fauna, sistemas de producción, aspectos socioeconómicos y culturales, y lo que explicaron los expositores."],["Análisis","Relaciona lo que viste: ¿cómo influyen el relieve, el clima y el suelo en lo que se produce y en cómo vive la gente?"],["Conclusiones","Lo más importante que aprendieron como equipo."],["Agradecimientos","A productores, expositores, comunidades e instituciones que recibieron al grupo."],["Figuras y cuadros","Cada foto, mapa o climograma con número, pie, lugar y autor de la foto; cada cuadro con título y fuente."],["Referencias","Fuentes consultadas, en formato APA."]],"libro":[["Preliminares",["Portada y portadilla","Página legal: créditos, ISBN o DOI, licencia y cómo citar el libro","Dedicatoria (opcional)","Índice general, de figuras y de cuadros","Presentación de los coordinadores","Agradecimientos generales"]],["Introducción general",["El Viaje de Estudio Integrador I en la formación del agrónomo","Objetivos del viaje","Mapa general de la ruta y perfil altitudinal","Método de trabajo: bitácora, cuaderno de campo y entrevistas"]],["Capítulos 1 a 9",["Un capítulo por día, escrito por el equipo responsable de ese día"]],["Cierre",["Síntesis del transecto: de la costa al Altiplano y al semidesierto (comparación de climas, suelos, vegetación y sistemas de producción)","Conclusiones generales"]],["Material de consulta",["Glosario de términos agronómicos y ambientales","Referencias generales","Anexos: itinerario, climogramas y fórmulas climáticas, listas de especies, directorio de expositores y costos","Créditos fotográficos","Semblanza breve de autores y coordinadores"]]],"dias":[{"n":1,"fecha":"Jueves 26 de noviembre","iso":"2026-11-26","region":"Centro de Veracruz: de la montaña a los lomeríos y la planicie costera","tema":"Suelos, clima y agricultura tradicional del trópico seco","pernocta":"Casa ejidal de Las Tinajitas, Actopan, Ver.","color":"#2f6b4f","sitios":[{"id":"d1-salida","tipo":"traslado","hora":"06:45","nombre":"Salida del Parque Zaragoza","lugar":"Huatusco, Veracruz","punto":"huatusco","actividad":"Reunión y salida del autobús. El equipo del día revisa que todo el equipaje esté a bordo.","lat":19.1502,"lon":-96.9605,"alt":1289,"dia":1,"corto":null,"km":0},{"id":"d1-camaroncillo","tipo":"visita","hora":"08:00 – 10:00","nombre":"Parcelas de cultivos tradicionales de Camaroncillo","lugar":"Camaroncillo, municipio de Puente Nacional, Veracruz","punto":"camaroncillo","actividad":"Visita a parcelas de cultivos tradicionales. Observar geología y suelos (pedregosidad, profundidad, color, textura y fertilidad), clima (sombra de lluvia, estacionalidad de la lluvia, canícula) y los sistemas agrícolas dominantes.","costo":{"monto":0,"texto":"Sin cobro"},"temas":["Suelos","Clima","Sistemas agrícolas"],"ficha":{"fisica":"Lomeríos de la planicie interior veracruzana, al pie de la Sierra Madre Oriental y del Eje Neovolcánico. El relieve está cortado por barrancas de ríos que bajan de la montaña; en laderas afloran rocas y el suelo es delgado.","clima":"Cálido subhúmedo con lluvias en verano (de junio a octubre) y una temporada seca larga de noviembre a mayo. A media temporada de lluvias ocurre la canícula: dos a cuatro semanas secas y calurosas en julio y agosto que afectan al maíz si coincide con la floración.","suelo":"Suelos arcillosos de lomerío, de color rojizo a oscuro, someros y pedregosos en laderas, más profundos en las partes bajas. Las arcillas se agrietan en la sequía (vertisoles) y se vuelven pegajosas en lluvias.","flora":["Palo mulato (Bursera simaruba)","Cocuite (Gliricidia sepium)","Guácimo (Guazuma ulmifolia)","Huizache (Vachellia farnesiana)","Jobo (Spondias mombin)","Ceiba (Ceiba pentandra)","Cornezuelo (Vachellia cornigera)"],"fauna":["Chachalaca (Ortalis vetula)","Urraca copetona (Calocitta formosa)","Zanate (Quiscalus mexicanus)","Iguana verde (Iguana iguana)","Garrobo (Ctenosaura sp.)","Tlacuache (Didelphis sp.)","Armadillo (Dasypus novemcinctus)","Zopilote (Coragyps atratus)"],"agro":"Agricultura de temporal: milpa (maíz, frijol, calabaza), caña de azúcar, mango y otros frutales, potreros para ganado de doble propósito y huertos familiares. Se depende del calendario de lluvias.","ambiental":"Erosión en laderas desmontadas, quemas agrícolas y pérdida de selva baja por potreros. La canícula y las sequías más largas son un riesgo creciente con el cambio climático.","socio":"Pequeños productores y ejidatarios; la producción combina autoconsumo y venta local. La migración de jóvenes a las ciudades y a Estados Unidos deja el trabajo del campo a personas mayores.","cultura":"Tradiciones campesinas del centro de Veracruz: la milpa, el son jarocho y la cocina de maíz (tortillas, gordas, tamales). Puente Nacional fue paso del Camino Real entre el puerto de Veracruz y la Ciudad de México."},"observar":["Color, textura y profundidad del suelo en una ladera y en una parte baja. ¿Hay piedras? ¿Qué tanto?","¿Qué se siembra y cómo? Distancia entre plantas, asociaciones de cultivos y uso de herramientas.","Señales del clima: plantas sin hojas (temporada seca), sistemas de riego o captación de agua.","¿De dónde viene el agua para la casa y para los animales?"],"preguntas":["¿Por qué un suelo de ladera es más delgado que uno de la parte baja?","¿Cómo afecta la canícula a la milpa y qué hacen los productores para enfrentarla?","¿Qué cultivos se adaptan mejor a una temporada seca de seis meses?"],"lat":19.2283,"lon":-96.6847,"alt":494,"dia":1,"corto":"Camaroncillo","clima":{"formula":"Aw0(w)(i')g","rasgos":["Cálido subhúmedo, el más seco de los subhúmedos, con lluvias en verano","lluvia invernal menor de 5 % del total anual","con poca oscilación térmica (entre 5  geología volcánica, clima templado-frío y transición de la vegetación desde bosque de pino a bosque mixto y bosque de oyamel. Entrevistas a productores de papa colaborando en la cosecha (tracción manual y animal). Atiende al grupo una bióloga de la CONANP.","expone":"Bióloga de la CONANP (Parque Nacional Cofre de Perote)","costo":{"monto":150,"texto":"150 pesos por persona; el pago se hace ahí. Suben unas 10 personas por viaje a la parte alta"},"temas":["Volcán","Zonas de vida","Papa y cebada","Diversidad animal"],"ficha":{"fisica":"Volcán escudo extinto de 4,282 m, el Nauhcampatépetl («montaña cuadrada» en náhuatl), por la forma de la roca de la cumbre. Forma parte del Eje Neovolcánico Transmexicano. En pocos kilómetros se suben más de 1,500 m.","clima":"De templado a frío de montaña: la temperatura baja unos 6 °C por cada 1,000 m de ascenso. En la cima hay heladas casi todo el año y en invierno puede nevar. Ladera oriental húmeda, ladera occidental (Perote) más seca.","suelo":"Andosoles de ceniza volcánica: oscuros, ricos en materia orgánica, muy porosos y fáciles de erosionar cuando se pierde el bosque.","flora":["Pino de las alturas (Pinus hartwegii), cerca del límite del bosque","Oyamel (Abies religiosa)","Pinos (Pinus montezumae, P. patula)","Encinos (Quercus spp.)","Aile (Alnus)","Zacatonal alpino sobre los 3,900 m","Musgos, líquenes y hongos del bosque"],"fauna":["Conejo montés (Sylvilagus sp.), que da nombre al ejido","Ardilla gris (Sciurus aureogaster)","Coyote","Gato montés (Lynx rufus)","Tuza","Salamandras de montaña (Pseudoeurycea)","Lagartija de montaña (Sceloporus)","Colibríes de altura","Pájaros carpinteros","Cuervo (Corvus corax)","Aguililla cola roja (Buteo jamaicensis)"],"agro":"Papa, cebada, avena y haba de temporal en laderas, con tracción animal y trabajo manual; borregos para lana y carne. La papa es el principal cultivo comercial y el que más presiona al bosque.","ambiental":"Parque Nacional desde 1937. Problemas: tala, cambio de bosque a papa en laderas, erosión, incendios y plagas forestales. El bosque capta el agua que abastece a ciudades como Xalapa y Perote.","socio":"Ejidos y comunidades que viven de la papa, la madera y los borregos. Programas de pago por servicios ambientales buscan compensar a quienes conservan el bosque.","cultura":"La montaña tiene nombre náhuatl y un lugar en la historia regional; los productores conservan prácticas como el uso de yunta y la selección de semilla de papa."},"observar":["Cómo cambia la vegetación con la altura: anota la altitud (está en la app) cuando veas un cambio.","Rocas volcánicas: color, burbujas (vesículas), tamaño.","Huellas, excretas, nidos o cantos: evidencias indirectas de fauna.","En la parcela de papa: pendiente, surcos, herramientas, rendimiento y precio de venta.","Cómo te sientes con la altura: respiración, frío, cansancio."],"preguntas":["¿Por qué cambia la vegetación conforme subimos la montaña?","¿Qué relación hay entre el bosque del Cofre y el agua que llega a las ciudades?","¿Cómo se podría producir papa sin perder bosque ni suelo?"],"lat":19.5322,"lon":-97.1547,"alt":3259,"dia":3,"corto":"Cofre de Perote","clima":{"formula":"C(E)(w2)big","rasgos":["Semifrío subhúmedo, el más húmedo de los subhúmedos, con lluvias en verano","lluvia invernal entre 5 y 10.2 % del total anual","verano fresco y largo (mes más cálido entre 6.5 y 22 °C)","isotermal (oscilación anual de la temperatura menor de 5 °C)","marcha de la temperatura tipo Ganges: el mes más cálido llega antes del solsticio de verano"],"descripcion":"Semifrío subhúmedo, el más húmedo de los subhúmedos, con lluvias en verano. La temperatura media anual es de 10.2 °C: el mes más fresco es enero (7.8 °C) y el más cálido abril (12.4 °C). Llueven 861 mm al año, 82 % de ellos entre mayo y octubre; el mes seco es marzo (lluvia menor que el doble de la temperatura). Las noches de invierno son frías (mínima media de 1.6 °C) y puede helar algunos días. La sombra de lluvia es muy marcada: en Tembla oma taylori), endémico y en peligro crítico","Charal de Alchichica (Poblana alchichica), pez endémico","Pequeños crustáceos del zooplancton","Aves acuáticas migratorias en invierno"],"agro":"Alrededor: maíz y cebada de temporal, alfalfa con riego de pozo y pastoreo de borregos.","ambiental":"La extracción de agua subterránea para riego hace bajar el nivel del lago y aumenta su salinidad, lo que amenaza a sus especies endémicas. Los estromatolitos se rompen al pisarlos y tardan siglos en formarse.","socio":"Comunidades rurales de temporal en una región semiárida, con migración y turismo local los fines de semana.","cultura":"«Axalapazco» viene del náhuatl y alude a una vasija de arena con agua. La laguna tiene leyendas locales y es un sitio de estudio de científicos de México y del extranjero."},"observar":["Color del agua y de la orilla; busca costras de sal.","Forma de los estromatolitos (sin pisarlos): textura, color y dónde están.","Plantas que crecen cerca del agua y lejos de ella.","Aves y otros animales en la laguna."],"preguntas":["¿Cómo se formó el cráter de Alchichica?","¿Qué son los estromatolitos y por qué son importantes para entender el origen de la vida?","¿Por qué una especie endémica es más vulnerable a desaparecer?"],"lat":19.4067,"lon":-97.3964,"alt":2341,"dia":4,"corto":"Alchichica","clima":{"formula":"BS1kw\"(i')g","rasgos":["Semiárido, el menos seco de los semisecos, templado, con lluvias en verano","lluvia invernal entre 5 y 10.2 % del total anual","con poca oscilación térmica (entre 5 y 7 °C)","marcha de la temperatura tipo Ganges: el mes más cálido llega antes del solsticio de verano","con canícula: sequía relativa a mitad del verano"],"descripcion":"Semiárido, el menos seco de los semisecos, templado, con lluvias en verano. La temperatura media anual es de 13.9 °C: el mes más fresco es enero (10.4 °C) y el más cálido mayo (16.3 °C). Llueven 393 mm al año, 82 % de ellos entre mayo y octubre; los meses secos son enero, febrero, marzo, noviembr           datos = new Uint8Array(await new Response(new Blob([datos]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).arrayBuffer());
        }
        const xml = new DOMParser().parseFromString(new TextDecoder().decode(datos), "application/xml");
        const W = "http://schemas.openxmlformats.org/wordprocessingml/2006/main";
        return [...xml.getElementsByTagNameNS(W, "p")].map((par) => {
          let t = "";
          par.querySelectorAll("*").forEach((n) => {
            if (n.namespaceURI !== W) return;
            if (n.localName === "t") t += n.textContent;
            else if (n.localName === "tab") t += "\t";
            else if (n.localName === "br") t += "\n";
          });
          return t;
        }).join("\n").replace(/\n{3,}/g, "\n\n").trim();
      }
      p += 46 + ln + le + lc;
    }
    throw new Error("No se encontró el texto dentro del archivo de Word.");
  }

  return { crear, leerTexto, zip };
})();

<script>
// Mapa 3D del viaje (three.js r128): relieve, rutas por día y sitios. Funciona sin internet.
// crearMapa3D(contenedor, {malla, rutas:[{dia, color, puntos:[[lat,lon]...]}], sitios:[{id, dia, etiqueta, lat, lon}], alIr, cielo})
function crearMapa3D(cont, cfg) {
  const { malla } = cfg;
  const [LO0, LO1, LA0, LA1] = malla.bbox;
  const NX = malla.nx, NY = malla.ny, EL = malla.elev;
  const KMX = (LO1 - LO0) * 111.32 * Math.cos(((LA0 + LA1) / 2) * Math.PI / 180);
  const KMY = (LA1 - LA0) * 110.57;
  const EXAG = 7;
  const Y = (e) => (Math.max(e, 0) / 1000) * EXAG;
  const aXZ = (lat, lon) => [(lon - LO0) / (LO1 - LO0) * KMX - KMX / 2, (LA1 - lat) / (LA1 - LA0) * KMY - KMY / 2];
  function altura(lat, lon) {
    const fx = (lon - LO0) / (LO1 - LO0) * (NX - 1), fy = (LA1 - lat) / (LA1 - LA0) * (NY - 1);
    const i = Math.max(0, Math.min(NX - 2, Math.floor(fx))), j = Math.max(0, Math.min(NY - 2, Math.floor(fy)));
    const tx = fx - i, ty = fy - j, e = (a, b) => EL[b * NX + a];
    return (e(i, j) * (1 - tx) + e(i + 1, j) * tx) * (1 - ty) + (e(i, j + 1) * (1 - tx) + e(i + 1, j + 1) * tx) * ty;
  }

  let renderer;
  try { renderer = new THREE.WebGLRenderer({ antialias: true }); }
  catch (e) { cont.innerHTML = '<p class="sin-3d">Este teléfono no puede mostrar el mapa en 3D. Usa el mapa plano.</p>'; return null; }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  cont.appendChild(renderer.domElement);
  const escena = new THREE.Scene();
  escena.background = new THREE.Color(cfg.cielo || 0xe6ece4);
  escena.fog = new THREE.Fog(escena.background, 380, 900);
  const camara = new THREE.PerspectiveCamera(38, 1, 1, 3000);

  // terreno con colores hipsométricos (mar en azul)
  const geo = new THREE.PlaneGeometry(KMX, KMY, NX - 1, NY - 1);
  geo.rotateX(-Math.PI / 2);
  const pos = geo.attributes.position, col = [];
  const rampa = [[0, [178, 205, 214]], [5, [196, 206, 160]], [300, [170, 194, 120]], [900, [120, 166, 96]], [1600, [150, 160, 98]],
                 [2300, [186, 170, 120]], [2900, [120, 138, 92]], [3600, [92, 112, 80]], [4300, [160, 150, 140]], [5000, [245, 245, 245]]];
  function color(e) {
    for (let k = 0; k < rampa.length - 1; k++) {
      const [e0, c0] = rampa[k], [e1, c1] = rampa[k + 1];
      if (e <= e1) { const t = Math.max(0, (e - e0) / (e1 - e0)); return c0.map((v, q) => (v + (c1[q] - v) * t) / 255); }
    }
    return [1, 1, 1];
  }
  for (let k = 0; k < pos.count; k++) { pos.setY(k, Y(EL[k])); col.push(...color(EL[k])); }
  geo.setAttribute("color", new THREE.Float32BufferAttribute(col, 3));
  geo.computeVertexNormals();
  escena.add(new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ vertexColors: true })));
  const base = new THREE.Mesh(new THREE.BoxGeometry(KMX, 3, KMY), new THREE.MeshLambertMaterial({ color: 0x8a7458 }));
  base.position.y = -1.5;
  escena.add(base);
  escena.add(new THREE.HemisphereLight(0xffffff, 0x6b5a40, 0.75));
  const sol = new THREE.DirectionalLight(0xffffff, 0.8);
  sol.position.set(-200, 260, -120);
  escena.add(sol);

  // rutas (un tubo por día)
  const tubos = {}, curvas = {}, avance = {};
  cfg.rutas.forEach((r) => {
    const v = r.puntos.map(([la, lo]) => { const [x, z] = aXZ(la, lo); return new THREE.Vector3(x, Y(altura(la, lo)) + 0.6, z); });
    const curva = new THREE.CatmullRomCurve3(v, false, "centripetal");
    const m = new THREE.MeshBasicMaterial({ color: r.color, transparent: true, opacity: 1 });
    const segs = Math.min(v.length * 2, 1600);
    const t = new THREE.Mesh(new THREE.TubeGeometry(curva, segs, 0.75, 6, false), m);
    curvas[r.dia] = curva;
    // tramo ya recorrido: tubo más grueso y dorado que se va mostrando con drawRange
    const gA = new THREE.TubeGeometry(curva, segs, 1.15, 8, false);
    gA.setDrawRange(0, 0);
    const tA = new THREE.Mesh(gA, new THREE.MeshBasicMaterial({ color: cfg.colorAvance || 0xe7b416 }));
    tA.visible = false;
    escena.add(tA);
    avance[r.dia] = { mesh: tA, segs, radial: 8 };
    escena.add(t);
    tubos[r.dia] = t;
  });

  // sitios
  const capa = document.createElement("div");
  capa.className = "capa-etiquetas";
  cont.appendChild(capa);
  const pines = cfg.sitios.map((s) => {
    const [x, z] = aXZ(s.lat, s.lon), y = Y(altura(s.lat, s.lon));
    const h = 7;
    const palo = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.25, h, 6), new THREE.MeshBasicMaterial({ color: 0x1f2a24 }));
    palo.position.set(x, y + h / 2, z);
    const cabeza = new THREE.Mesh(new THREE.SphereGeometry(1.3, 12, 10), new THREE.MeshBasicMaterial({ color: s.color || 0x1f2a24 }));
    cabeza.position.set(x, y + h, z);
    escena.add(palo, cabeza);
    const et = document.createElement("button");
    et.type = "button";
    et.className = "etiqueta-3d";
    et.innerHTML = `<i style="background:${s.colorCss || "#1f2a24"}">${s.dia}</i><span>${s.etiqueta}</span>`;
    et.setAttribute("aria-label", s.etiqueta);
    if (cfg.alIr) et.addEventListener("click", () => cfg.alIr(s));
    capa.appendChild(et);
    return { s, vec: new THREE.Vector3(x, y + h, z), et, palo, cabeza };
  });

  const CENTRO = new THREE.Vector3(0, 0, 0);
  function vistaGeneral() {
    const r = cont.clientWidth / Math.max(1, cont.clientHeight);
    if (r < 1.1) return { pos: new THREE.Vector3(KMX * 0.95, 330, 70), obj: new THREE.Vector3(-25, 0, 5) };
    return { pos: new THREE.Vector3(-20, 250, 255), obj: CENTRO.clone() };
  }
  const v0 = vistaGeneral();
  camara.position.copy(v0.pos);
  let controles = null;
  if (THREE.OrbitControls) {
    controles = new THREE.OrbitControls(camara, renderer.domElement);
    controles.target.copy(v0.obj);
    controles.enableDamping = true;
    controles.dampingFactor = 0.08;
    controles.maxPolarAngle = Math.PI * 0.47;
    controles.minDistance = 15;
    controles.maxDistance = 700;
    controles.update();
  } else camara.lookAt(v0.obj);

  function tamano() {
    const w = cont.clientWidth, h = cont.clientHeight;
    renderer.setSize(w, h, false);
    camara.aspect = w / h;
    camara.updateProjectionMatrix();
  }
  new ResizeObserver(tamano).observe(cont);
  tamano();

  let diaActivo = null;
  const v = new THREE.Vector3();
  function etiquetas() {
    const w = cont.clientWidth, h = cont.clientHeight;
    const usadas = [];
    pines.forEach(({ s, vec, et }) => {
      if (diaActivo !== null && s.dia !== diaActivo) { et.hidden = true; return; }
      v.copy(vec).project(camara);
      let fuera = v.z > 1 || v.x < -1.05 || v.x > 1.05 || v.y < -1.05 || v.y > 1.05;
      const px = (v.x + 1) / 2 * w, py = (1 - v.y) / 2 * h;
      // en la vista de todo el viaje se ocultan etiquetas que se enciman
      if (!fuera && diaActivo === null && usadas.some(([a, b]) => Math.abs(a - px) < 70 && Math.abs(b - py) < 22)) fuera = true;
      et.hidden = fuera;
      if (!fuera) { usadas.push([px, py]); et.style.transform = `translate(${px}px, ${py}px) translate(-50%, -125%)`; }
    });
  }

  // posición del teléfono en vivo (GPS; no necesita internet)
  let yo = null, etYo = null, rastro = null, seguir = false, pulso = 0;
  const rastroPts = [];
  function ponerYo(lat, lon, opc = {}) {
    if (lon < LO0 || lon > LO1 || lat < LA0 || lat > LA1) return false;
    const [x, z] = aXZ(lat, lon), y = Y(altura(lat, lon));
    if (!yo) {
      const rojo = new THREE.MeshBasicMaterial({ color: 0xd63a2f });
      const haz = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 12, 8), rojo);
      haz.position.y = 6;
      const bola = new THREE.Mesh(new THREE.SphereGeometry(2.1, 18, 14), rojo);
      bola.position.y = 12.5;
      const anillo = new THREE.Mesh(new THREE.RingGeometry(2.4, 3.4, 40),
        new THREE.MeshBasicMaterial({ color: 0xd63a2f, transparent: true, opacity: 0.7, side: THREE.DoubleSide }));
      anillo.rotation.x = -Math.PI / 2;
      anillo.position.y = 0.9;
      yo = new THREE.Group();
      yo.add(haz, bola, anillo);
      yo.userData.anillo = anillo;
      escena.add(yo);
      etYo = document.createElement("div");
      etYo.className = "etiqueta-3d etiqueta-yo";
      etYo.innerHTML = "<i>●</i><span>Tú</span>";
      capa.appendChild(etYo);
    }
    yo.visible = true;
    etYo.hidden = false;
    yo.position.set(x, y, z);
    const p = new THREE.Vector3(x, y + 0.9, z);
    if (!rastroPts.length || rastroPts[rastroPts.length - 1].distanceTo(p) > 0.15) rastroPts.push(p);
    if (rastroPts.length > 1) {
      if (rastro) { escena.remove(rastro); rastro.geometry.dispose(); }
      rastro = new THREE.Line(new THREE.BufferGeometry().setFromPoints(rastroPts), new THREE.LineBasicMaterial({ color: 0xd63a2f }));
      escena.add(rastro);
    }
    seguir = !!opc.seguir;
    if (seguir) {
      const obj = controles ? controles.target : CENTRO;
      const off = camara.position.clone().sub(obj);
      if (opc.acercar || off.length() > 160) off.setLength(opc.acercar ? 70 : 160);
      volar(new THREE.Vector3(x, y, z).add(off), new THREE.Vector3(x, y, z));
    }
    return true;
  }
  function quitarYo() {
    seguir = false;
    if (yo) yo.visible = false;
    if (etYo) etYo.hidden = true;
  }

  // autobús de Chapingo: recorre la ruta del día y marca el tramo recorrido
  let bus = null, etBus = null, paseo = null;
  function texturaBus(lado) {
    const c = document.createElement("canvas");
    c.width = 256; c.height = 96;
    const g = c.getContext("2d");
    g.fillStyle = "#fbfbf7"; g.fillRect(0, 0, 256, 96);
    g.fillStyle = "#1d4f9c"; g.fillRect(0, 54, 256, 22);
    g.fillStyle = "#c9a227"; g.fillRect(0, 76, 256, 6);
    if (lado) {
      g.fillStyle = "#3b5566";
      for (let i = 0; i < 6; i++) g.fillRect(14 + i * 40, 12, 30, 30);
      g.fillStyle = "#ffffff"; g.font = "bold 20px Palatino Linotype, Georgia, serif"; g.textAlign = "center"; g.fillText("CHAPINGO", 128, 72);
    } else {
      g.fillStyle = "#3b5566"; g.fillRect(16, 12, 224, 32);
    }
    const t = new THREE.CanvasTexture(c);
    t.anisotropy = 4;
    return t;
  }
  function crearBus() {
    const lado = new THREE.MeshLambertMaterial({ map: texturaBus(true) });
    const frente = new THREE.MeshLambertMaterial({ map: texturaBus(false) });
    const techo = new THREE.MeshLambertMaterial({ color: 0xffffff });
    // eje x = largo del autobús
    const cuerpo = new THREE.Mesh(new THREE.BoxGeometry(5.2, 2.2, 2.1), [frente, frente, techo, techo, lado, lado]);
    cuerpo.position.y = 1.5;
    const sombra = new THREE.Mesh(new THREE.CircleGeometry(3.6, 24), new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.25 }));
    sombra.rotation.x = -Math.PI / 2; sombra.position.y = 0.2;
    bus = new THREE.Group();
    bus.add(sombra, cuerpo);
    escena.add(bus);
    etBus = document.createElement("div");
    etBus.className = "etiqueta-3d etiqueta-bus";
    etBus.innerHTML = "<i>🚌</i><span>Chapingo</span>";
    capa.appendChild(etBus);
  }
  function marcarAvance(dia, t) {
    Object.entries(avance).forEach(([d, a]) => {
      const activo = Number(d) === dia;
      a.mesh.visible = activo && t > 0;
      if (activo) a.mesh.geometry.setDrawRange(0, Math.floor(Math.max(0, Math.min(1, t)) * a.segs) * a.radial * 6);
    });
  }
  function ponerBus(dia, t, opc = {}) {
    const curva = curvas[dia];
    if (!curva) return false;
    if (!bus) crearBus();
    t = Math.max(0, Math.min(1, t));
    const p = curva.getPointAt(t), q = curva.getPointAt(Math.min(1, t + 0.003)), r = curva.getPointAt(Math.max(0, t - 0.003));
    const dir = (t < 0.997 ? q.clone().sub(p) : p.clone().sub(r)).setY(0);
    bus.position.copy(p);
    bus.rotation.set(0, Math.atan2(-dir.z, dir.x), 0);
    bus.visible = true; etBus.hidden = false;
    marcarAvance(dia, t);
    if (opc.seguir) {
      const d = dir.lengthSq() ? dir.normalize() : new THREE.Vector3(1, 0, 0);
      const posCam = p.clone().add(d.multiplyScalar(-34)).add(new THREE.Vector3(0, 24, 0));
      camara.position.lerp(posCam, opc.suave === false ? 1 : 0.06);
      if (controles) controles.target.lerp(p, opc.suave === false ? 1 : 0.12); else camara.lookAt(p);
    }
    return true;
  }
  function quitarBus() {
    paseo = null;
    if (bus) bus.visible = false;
    if (etBus) etBus.hidden = true;
    marcarAvance(-1, 0);
  }
  function recorrer(dia, opc = {}) {
    if (!curvas[dia]) return null;
    anim = null;
    paseo = { dia, t: opc.desde || 0, dur: opc.duracion || 45, pausa: false, prev: performance.now(), alAvanzar: opc.alAvanzar, alTerminar: opc.alTerminar };
    ponerBus(dia, paseo.t, { seguir: true, suave: false });
    return {
      pausar() { if (paseo) paseo.pausa = true; },
      seguir() { if (paseo) { paseo.pausa = false; paseo.prev = performance.now(); } },
      detener() { quitarBus(); },
      get pausado() { return !paseo || paseo.pausa; },
    };
  }
  function pasoPaseo() {
    if (bus && bus.visible) {
      v.set(bus.position.x, bus.position.y + 3, bus.position.z).project(camara);
      const fuera = v.z > 1 || Math.abs(v.x) > 1.05 || Math.abs(v.y) > 1.05;
      etBus.hidden = fuera;
      if (!fuera) etBus.style.transform = `translate(${(v.x + 1) / 2 * cont.clientWidth}px, ${(1 - v.y) / 2 * cont.clientHeight}px) translate(-50%, -150%)`;
    }
    if (!paseo) return;
    const ahora = performance.now();
    if (!paseo.pausa) paseo.t = Math.min(1, paseo.t + (ahora - paseo.prev) / 1000 / paseo.dur);
    paseo.prev = ahora;
    ponerBus(paseo.dia, paseo.t, { seguir: true });
    if (paseo.alAvanzar) paseo.alAvanzar(paseo.t);
    if (paseo.t >= 1 && !paseo.pausa) { paseo.pausa = true; const fin = paseo.alTerminar; if (fin) fin(); }
  }

  let anim = null;
  function volar(p1, o1) {
    anim = { t: 0, p0: camara.position.clone(), o0: (controles ? controles.target : CENTRO).clone(), p1, o1 };
  }
  const reducir = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function cuadro() {
    if (anim) {
      anim.t = reducir ? 1 : Math.min(1, anim.t + 0.025);
      const k = anim.t < 0.5 ? 2 * anim.t * anim.t : 1 - Math.pow(-2 * anim.t + 2, 2) / 2;
      camara.position.lerpVectors(anim.p0, anim.p1, k);
      const o = new THREE.Vector3().lerpVectors(anim.o0, anim.o1, k);
      if (controles) controles.target.copy(o); else camara.lookAt(o);
      if (anim.t >= 1) anim = null;
    }
    if (controles) controles.update();
    pasoPaseo();
    if (yo && yo.visible) {
      pulso = (pulso + 0.03) % 1;
      const k = 1 + pulso * 1.6;
      yo.userData.anillo.scale.set(k, k, k);
      yo.userData.anillo.material.opacity = 0.7 * (1 - pulso);
      v.set(yo.position.x, yo.position.y + 12.5, yo.position.z).project(camara);
      const fuera = v.z > 1 || Math.abs(v.x) > 1.05 || Math.abs(v.y) > 1.05;
      etYo.hidden = fuera;
      if (!fuera) etYo.style.transform = `translate(${(v.x + 1) / 2 * cont.clientWidth}px, ${(1 - v.y) / 2 * cont.clientHeight}px) translate(-50%, -135%)`;
    }
    renderer.render(escena, camara);
    etiquetas();
    requestAnimationFrame(cuadro);
  }
  cuadro();

  return {
    general() {
      diaActivo = null;
      Object.values(tubos).forEach((t) => (t.material.opacity = 1));
      pines.forEach((p) => { p.palo.visible = p.cabeza.visible = true; });
      const g = vistaGeneral();
      volar(g.pos, g.obj);
    },
    dia(n) {
      diaActivo = n;
      Object.entries(tubos).forEach(([d, t]) => (t.material.opacity = Number(d) === n ? 1 : 0.18));
      pines.forEach((p) => { p.palo.visible = p.cabeza.visible = p.s.dia === n; });
      const ps = pines.filter((p) => p.s.dia === n).map((p) => p.vec);
      const tubo = tubos[n];
      if (tubo) { tubo.geometry.computeBoundingBox(); }
      const caja = new THREE.Box3();
      ps.forEach((q) => caja.expandByPoint(q));
      if (tubo) caja.union(tubo.geometry.boundingBox);
      const c = caja.getCenter(new THREE.Vector3());
      const tam = Math.max(30, caja.getSize(new THREE.Vector3()).length());
      const r = cont.clientWidth / Math.max(1, cont.clientHeight);
      const k = r < 1.1 ? 1.35 : 1;
      volar(new THREE.Vector3(c.x - tam * 0.15 * k, c.y + tam * 0.75 * k, c.z + tam * 0.95 * k), c);
    },
    altura,
    yo: ponerYo,
    recorrer,
    ponerBus,
    quitarBus,
    quitarYo,
    dentro: (lat, lon) => lon >= LO0 && lon <= LO1 && lat >= LA0 && lat <= LA1,
  };
}

<script>
(() => {
"use strict";
const D = window.DATOS, V = D.viaje, M = window.MALLA;
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (t) => String(t ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmt = (n) => Number(n).toLocaleString("es-MX");
const pesos = (n) => "$" + Number(n).toLocaleString("es-MX", { maximumFractionDigits: 2 });
const LOGO = window.LOGO_SRC || "vendor/logo_uach_web.jpg";
const SITIOS = D.dias.flatMap((d) => d.sitios);
const CORTO = (s) => s.corto || s.nombre;

// ------------------------------------------------------------------ almacenamiento en el teléfono
const BD = (() => {
  let db = null;
  const mem = new Map(), memF = new Map();
  const listo = new Promise((res) => {
    try {
      const r = indexedDB.open("viaje-generacional-21", 1);
      r.onupgradeneeded = () => { r.result.createObjectStore("kv"); r.result.createObjectStore("fotos", { keyPath: "id" }); };
      r.onsuccess = () => { db = r.result; res(); };
      r.onerror = () => res();
    } catch (e) { res(); }
  });
  const pedir = (store, modo, fn) => listo.then(() => new Promise((res) => {
    if (!db) return res(undefined);
    try {
      const t = db.transaction(store, modo), r = fn(t.objectStore(store));
      t.oncomplete = () => res(r && r.result);
      t.onerror = t.onabort = () => res(undefined);
    } catch (e) { res(undefined); }
  }));
  return {
    get: async (k) => (await listo, db ? pedir("kv", "readonly", (s) => s.get(k)) : mem.get(k)),
    set: async (k, v) => { await listo; if (!db) return mem.set(k, v); return pedir("kv", "readwrite", (s) => s.put(v, k)); },
    del: async (k) => { await listo; if (!db) return mem.delete(k); return pedir("kv", "readwrite", (s) => s.delete(k)); },
    todo: async () => {
      await listo;
      if (!db) return [...mem.entries()];
      const ks = await pedir("kv", "readonly", (s) => s.getAllKeys()) || [];
      const vs = await pedir("kv", "readonly", (s) => s.getAll()) || [];
      return ks.map((k, i) => [k, vs[i]]);
    },
    fotos: async (sitio) => {
      await listo;
      const todas = db ? (await pedir("fotos", "readonly", (s) => s.getAll())) || [] : [...memF.values()];
      return (sitio ? todas.filter((f) => f.sitio === sitio) : todas).sort((a, b) => a.fecha - b.fecha);
    },

function alturaMalla(lat, lon) {
  const [LO0, LO1, LA0, LA1] = M.bbox, NX = M.nx, NY = M.ny, EL = M.elev;
  if (lon < LO0 || lon > LO1 || lat < LA0 || lat > LA1) return null;
  const fx = (lon - LO0) / (LO1 - LO0) * (NX - 1), fy = (LA1 - lat) / (LA1 - LA0) * (NY - 1);
  const i = Math.min(NX - 2, Math.floor(fx)), j = Math.min(NY - 2, Math.floor(fy)), tx = fx - i, ty = fy - j, e = (a, b) => EL[b * NX + a];
  return Math.round((e(i, j) * (1 - tx) + e(i + 1, j) * tx) * (1 - ty) + (e(i, j + 1) * (1 - tx) + e(i + 1, j + 1) * tx) * ty);
}
async function entregar(blob, nombre) {
  // Dentro de claude.ai las descargas pasan por la plataforma; en GitHub, descarga normal
  if (window.claude && typeof window.claude.use === "function") {
    try {
      const dl = await window.claude.use("downloads");
      if (dl) { await dl.save({ filename: nombre, data: blob }); aviso("Archivo listo: " + nombre); return; }
    } catch (e) { if (e && e.code === "declined") return; }
  }
  const archivo = new File([blob], nombre, { type: blob.type });
  try {
    if (navigator.canShare && navigator.canShare({ files: [archivo] }) && /Android|iPhone|iPad/i.test(navigator.userAgent)) {
      await navigator.share({ files: [archivo], title: nombre });
      return;
    }
  } catch (e) { if (e && e.name === "AbortError") return; }
  const url = URL.createObjectURL(blob), a = document.createElement("a");
  a.href = url; a.download = nombre; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  aviso("Archivo listo: " + nombre);
}

// ------------------------------------------------------------------ perfiles de altitud (SVG)
function perfilSVG(series, { alto = 230, marcas = [] } = {}) {
  // series: [{color, puntos:[[km, alt]...], desde}] ; marcas: [{km, alt, color, txt}]
  const W = 900, H = alto, ml = 52, mr = 14, mt = 26, mb = 34;
  const kmMax = Math.max(...series.map((s) => s.desde + s.puntos[s.puntos.length - 1][0]), 1);
  const altMax = Math.ceil(Math.max(...series.flatMap((s) => s.puntos.map((p) => p[1])), 500) / 500) * 500;
  const X = (k) => ml + (k / kmMax) * (W - ml - mr), Y = (a) => mt + (1 - a / altMax) * (H - mt - mb);
  let s = `<svg class="perfil" viewBox="0 0 ${W} ${H}" role="img" aria-label="Perfil de altitud">`;
  const paso = altMax > 3000 ? 1000 : 500;
  for (let a = 0; a <= altMax; a += paso) s += `<line class="rej" x1="${ml}" x2="${W - mr}" y1="${Y(a)}" y2="${Y(a)}"/><text x="${ml - 6}" y="${Y(a) + 4}" text-anchor="end">${fmt(a)}</text>`;
  const pk = kmMax > 600 ? 100 : kmMax > 150 ? 25 : 10;
  for (let k = 0; k <= kmMax; k += pk) s += `<text x="${X(k)}" y="${H - mb + 18}" text-anchor="middle">${k}</text>`;
  s += `<text x="${W - mr}" y="${H - 4}" text-anchor="end">km</text><text x="4" y="12">msnm</text>`;
  for (const se of series) {
    const pts = se.puntos.map(([k, a]) => `${X(se.desde + k).toFixed(1)},${Y(a).toFixed(1)}`).join(" ");
    const x0 = X(se.desde + se.puntos[0][0]), x1 = X(se.desde + se.puntos[se.puntos.length - 1][0]);
    if (se.veg && D.veg) {
      // el área bajo la curva se colorea por tipo de vegetación
      for (const [k0, k1, c] of se.veg) {
        const tramo = se.puntos.filter(([k]) => k >= k0 - 0.01 && k <= k1 + 0.01);
        if (tramo.length < 2) continue;
        const pp = tramo.map(([k, a]) => `${X(se.desde + k).toFixed(1)},${Y(a).toFixed(1)}`).join(" ");
        s += `<polygon fill="${D.veg[c].color}" opacity=".62" points="${X(se.desde + tramo[0][0]).toFixed(1)},${Y(0)} ${pp} ${X(se.desde + tramo[tramo.length - 1][0]).toFixed(1)},${Y(0)}"><title>${esc(D.veg[c].nombre)}</title></polygon>`;
      }
      s += `<polyline class="linea" stroke="${se.color}" points="${pts}"/>`;
    } else s += `<polygon class="area" fill="${se.color}" points="${x0},${Y(0)} ${pts} ${x1},${Y(0)}"/><polyline class="linea" stroke="${se.color}" points="${pts}"/>`;
    if (se.etiqueta) s += `<text x="${(x0 + x1) / 2}" y="${H - mb + 30}" text-anchor="middle" style="font-weight:700;fill:${se.color}">${se.etiqueta}</text>`;
  }
  for (const m of marcas) s += `<g class="sitio"><circle cx="${X(m.km)}" cy="${Y(m.alt)}" r="9" fill="${m.color}"/><text x="${X(m.km)}" y="${Y(m.alt) + 4}" text-anchor="middle">${m.txt}</text></g>`;
  return s + "</svg>";
}

// ------------------------------------------------------------------ climograma (Walter y Lieth: 10 °C = 20 mm)
const INI_MES = ["E", "F", "M", "A", "M", "J", "J", "A", "S", "O", "N", "D"];
function climogramaSVG(c, { tinta = "var(--tinta)", gris = "var(--gris)", rej = "var(--linea)", lluvia = "var(--lluvia)", calor = "var(--calor)", fondo = "none", titulo = "" } = {}) {
  const W = 520, H = 350, ml = 50, mr = 58, mt = titulo ? 74 : 38, mb = 38;
  // lluvia en unidades de temperatura: 2 mm = 1 °C hasta 100 mm; arriba de 100 mm, 20 mm = 1 °C
  const pT = (p) => (p <= 100 ? p / 2 : 50 + (p - 100) / 20);
  const tMin = Math.min(0, Math.floor(Math.min(...c.t) / 10) * 10);
  const tTop = Math.max(30, Math.ceil(Math.max(...c.t, ...c.p.map(pT)) / 10) * 10);
  const X = (i) => ml + (i + 0.5) * (W - ml - mr) / 12, Y = (t) => mt + (1 - (t - tMin) / (tTop - tMin)) * (H - mt - mb);
  const bw = (W - ml - mr) / 12 * 0.62;
  let s = `<svg class="climograma" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Climograma: temperatura y lluvia mensuales" font-family="Palatino Linotype, Palatino, Georgia, serif" font-size="18">`;
  if (fondo !== "none") s += `<rect width="${W}" height="${H}" fill="${fondo}"/>`;
  if (titulo) s += `<text x="${W / 2}" y="18" text-anchor="middle" font-size="19" font-weight="700" fill="${tinta}">${esc(titulo)}</text><text x="${W / 2}" y="40" text-anchor="middle" font-size="15" fill="${gris}">${esc(`${c.formula} · ${fmt(c.ta)} °C · ${fmt(c.P)} mm`)}</text>`;
  for (let t = tMin; t <= tTop; t += 10) {
    const pl = t <= 50 ? t * 2 : 100 + (t - 50) * 20;
    s += `<line x1="${ml}" x2="${W - mr}" y1="${Y(t)}" y2="${Y(t)}" stroke="${rej}" stroke-width="1"/>`;
    s += `<text x="${ml - 7}" y="${Y(t) + 4}" text-anchor="end" fill="${calor}">${t}</text>`;
    if (t >= 0) s += `<text x="${W - mr + 7}" y="${Y(t) + 4}" fill="${lluvia}">${fmt(pl)}</text>`;
  }
  c.p.forEach((p, i) => {
    const y0 = Y(0), y1 = Y(pT(p));
    s += `<rect x="${(X(i) - bw / 2).toFixed(1)}" y="${y1.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(0, y0 - y1).toFixed(1)}" fill="${lluvia}" opacity="${p > 100 ? 0.95 : 0.7}" rx="2"/>`;
    s += `<text x="${X(i)}" y="${H - mb + 24}" text-anchor="middle" fill="${gris}">${INI_MES[i]}</text>`;
  });
  if (c.p.some((p) => p > 100)) s += `<line x1="${ml}" x2="${W - mr}" y1="${Y(50)}" y2="${Y(50)}" stroke="${lluvia}" stroke-dasharray="4 4" stroke-width="1"/>`;
  const pts = c.t.map((t, i) => `${X(i).toFixed(1)},${Y(t).toFixed(1)}`).join(" ");
  s += `<polyline points="${pts}" fill="none" stroke="${calor}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>`;
  c.t.forEach((t, i) => (s += `<circle cx="${X(i).toFixed(1)}" cy="${Y(t).toFixed(1)}" r="3.6" fill="${calor}"/>`));
  s += `<text x="${ml - 7}" y="${mt - 16}" text-anchor="end" fill="${calor}" font-weight="700">°C</text><text x="${W - mr + 7}" y="${mt - 16}" fill="${lluvia}" font-weight="700">mm</text>`;
  return s + "</svg>";
}
function bloqueClima(c, s) {
  if (!c) return "";
  return `<div class="clima">
      <p class="formula"><span class="versalita">Fórmula climática</span><b class="num">${esc(c.formula)}</b></p>

      <p class="pie">Climograma: barras = lluvia mensual (mm), línea = temperatura media (°C). Escala 10 °C = 20 mm: los meses con barras por debajo de la línea son secos. Arriba de la línea punteada (100 mm) la lluvia se dibuja a 1/10. Estación ${esc(c.estacion)}, a ${fmt(c.dist)} km del sitio; normales ${esc(c.periodo)} del Servicio Meteorológico Nacional.</p>

async function climogramaPNG(c, titulo) {
  const svg = climogramaSVG(c, { tinta: "#1e2a23", gris: "#5d6459", rej: "#e2d9c6", lluvia: "#2a6f9c", calor: "#b23a2f", fondo: "#ffffff", titulo });

}

async function registro() { return (await BD.get("registro")) || null; }
async function autoresDia(n) {
  const oficial = D.equipos[n] || D.equipos[String(n)] || [];
  const r = await registro();
  const co = (await BD.get("coautores:" + n)) || [];
  const set = new Set(oficial);
  if (r && r.dia === n) { set.add(r.nombre); co.forEach((c) => set.add(c)); }
  // lista editada a mano en el día: {lista: [...en orden], quitados: [...]}
  const ed = (await BD.get("autores:" + n)) || { lista: [], quitados: [] };
  return [...ed.lista, ...[...set].filter((x) => !ed.lista.includes(x) && !ed.quitados.includes(x))];
}
async function editarAutores(n, fn) {
  const ed = (await BD.get("autores:" + n)) || { lista: [], quitados: [] };
  const actual = await autoresDia(n);
  const nueva = fn([...actual]);
  ed.lista = nueva;
  ed.quitados = [...new Set([...ed.quitados.filter((x) => !nueva.includes(x)), ...actual.filter((x) => !nueva.includes(x))])];
  await BD.set("autores:" + n, ed);
  pedirPersistencia();
}

async function llenarSitio(s) {
  for (const el of $$(`[data-k$="${s.id}"], [data-k^="obs:${s.id}:"]`)) {
    const v = await BD.get(el.dataset.k);
    if (v == null) continue;
    if (el.type === "checkbox") el.checked = !!v; else el.value = v;
  }
  await pintarFotos(s.id);
}
async function pintarFotos(sitio) {
  const cont = $(`[data-fotos="${sitio}"]`);
  if (!cont) return;
  cont.querySelectorAll("img").forEach((i) => URL.revokeObjectURL(i.src));
  const fotos = await BD.fotos(sitio);
  cont.innerHTML = fotos.map((f, i) => `<figure class="foto" style="margin:0"><img src="${URL.createObjectURL(f.blob)}" alt="${esc(f.pie || "Foto " + (i + 1))}" loading="lazy">
    <input data-pie="${f.id}" value="${esc(f.pie || "")}" placeholder="Pie de foto: qué se ve y dónde" aria-label="Pie de la foto ${i + 1}">
    <button type="button" data-quitar-foto="${f.id}">Quitar</button></figure>`).join("");
}
async function pintarGastos(d, extras) {
  const filas = [];
  let fijo = 0, pagado = 0;
  for (const s of [...d.sitios, ...extras]) {
    const p = Number(await BD.get("pago:" + s.id)) || 0;
    const m = s.costo && s.costo.monto ? s.costo.monto : 0;
    if (!m && !p && !(s.costo && s.costo.monto === null)) continue;
    fijo += m; pagado += p;
    filas.push(`<tr><td>${esc(s.nombre)}</td><td>${esc(s.costo ? s.costo.texto : "")}</td><td class="num">${m ? pesos(m) : "—"}</td><td class="num">${p ? pesos(p) : "—"}</td></tr>`);
  }
  $("#gastos-dia").innerHTML = filas.length ? `<div class="tabla-wrap"><table><thead><tr><th>Sitio o servicio</th><th>Condición</th><th class="num">Cuota</th><th class="num">Pagué</th></tr></thead>
    <tbody>${filas.join("")}</tbody><tfoot><tr><td colspan="2">Total del día</td><td class="num">${pesos(fijo)}</td><td class="num">${pesos(pagado)}</td></tr></tfoot></table></div>
    <p class="pie">«Cuota» es lo que indica el itinerario por persona; «Pagué» lo registras tú en cada sitio. Los costos marcados como «por confirmar» se actualizarán antes del viaje.</p>`
    : `<p class="gris">Sin cobros registrados para este día.</p>`;
}

async function prepararFoto(archivo) {
  let fuente;
  try { fuente = await createImageBitmap(archivo, { imageOrientation: "from-image" }); }
  catch (e) {
    fuente = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(archivo); });
  }
  const max = 1600, w0 = fuente.width, h0 = fuente.height, k = Math.min(1, max / Math.max(w0, h0));
  const c = document.createElement("canvas");
  c.width = Math.round(w0 * k); c.height = Math.round(h0 * k);
  c.getContext("2d").drawImage(fuente, 0, 0, c.width, c.height);
  const blob = await new Promise((res) => c.toBlob(res, "image/jpeg", 0.82));
  return { blob, w: c.width, h: c.height };
}
let persistido = false;
function pedirPersistencia() {
  if (persistido || !navigator.storage || !navigator.storage.persist) return;
  persistido = true;
  navigator.storage.persist().catch(() => {});
}

  };
  $("#ns-nombre").focus();
}

async function bloquesSitio(s, numFoto) {
  const b = [{ h2: s.nombre }];
  const datos = [s.lugar, s.hora ? "Hora: " + s.hora : "", s.alt != null ? "Altitud: " + fmt(s.alt) + " msnm" : "",
                 s.lat != null ? `Coordenadas: ${s.lat.toFixed(4)}, ${s.lon.toFixed(4)}` : ""].filter(Boolean).join(" · ");
  b.push({ nota: datos });
  const expo = (await BD.get("expo:" + s.id)) || s.expone;
  if (expo) b.push({ p: "Expone: " + expo });
  if (s.actividad || s.descripcion) b.push({ p: "Actividad: " + (s.actividad || s.descripcion) });
  if (s.clima) {
    const c = s.clima;
    b.push({ h3: "Condiciones físico-geográficas" });
    if (s.ficha) b.push({ p: "Relieve y geología: " + s.ficha.fisica });
    b.push({ p: `Clima local. Fórmula climática (Köppen modificado por García, 2004): ${c.formula}. ${c.descripcion}` });
    try {
      b.push(await climogramaPNG(c, `Climograma · ${CORTO(s)}`));
      numFoto.n++;
      b.push({ pie: `Figura ${numFoto.n}. Climograma de ${CORTO(s)}. Datos: Servicio Meteorológico Nacional, normales ${c.periodo}, estación ${c.estacion}.` });
    } catch (e) { /* sin climograma si el navegador no puede dibujarlo */ }
    if (s.ficha) b.push({ p: "Suelo: " + s.ficha.suelo });
  }
  b.push({ h3: "Observaciones de campo" });
  const nota = (await BD.get("nota:" + s.id)) || "";
  if (nota.trim()) nota.split(/\n{2,}/).forEach((p) => b.push({ p: p.trim() }));
  else b.push({ nota: "[Escribir aquí las observaciones del sitio: físico-geográficas, suelo, clima, flora, fauna, sistemas de producción, aspectos socioeconómicos y culturales.]" });
  const fotos = await BD.fotos(s.id);
  if (fotos.length) {
    b.push({ h3: "Fotografías" });
    for (const f of fotos) {
      numFoto.n++;
      b.push({ img: new Uint8Array(await f.blob.arrayBuffer()), ancho: f.w, alto: f.h, cm: 14 });
      b.push({ pie: `Figura ${numFoto.n}. ${f.pie || "[Pie de foto]"} ${s.lugar ? "(" + s.lugar.split(",")[0] + ")" : ""}` });
    }
  }
  return b;
}
async function exportarDia(n) {

  aviso("Preparando el Word…");
  const autores = await autoresDia(n), extras = (await BD.get("extras:" + n)) || [];
  const numFoto = { n: 0 };
  const b = [
    { titulo: `Día ${n}. ${d.tema}` },

async function exportarMiDia(n) {
  const d = D.dias.find((x) => x.n === n);
  aviso("Preparando tu día en Word…");
  const r = await registro(), carta0 = (await BD.get("carta")) || {};
  const quien = (r && r.nombre) || carta0.nombre || "";
  const extras = (await BD.get("extras:" + n)) || [];
  const numFoto = { n: 0 };
  const b = [
    { titulo: `Mi cuaderno de campo · Día ${n}` },
    { p: `${d.tema}`, b: true, jc: "left" },
    { p: `${d.fecha} de 2026 · ${d.region}`, jc: "left" },
    { p: "Estudiante: " + (quien || "______________________________"), jc: "left" },
    { nota: `${V.titulo} · ${V.asignatura} · ${V.nivel} · ${V.universidad}` },
  ];
  let total = 0, hayAlgo = false;
  for (const s of [...d.sitios, ...extras]) {
    const nota = ((await BD.get("nota:" + s.id)) || "").trim(), expo = await BD.get("expo:" + s.id), pago = Number(await BD.get("pago:" + s.id)) || 0;
    const fotos = await BD.fotos(s.id);
    const obs = [];
    for (let i = 0; i < (s.observar || []).length; i++) if (await BD.get(`obs:${s.id}:${i}`)) obs.push(s.observar[i]);
    const esVisita = s.tipo === "visita" || s.tipo === "extra";
    if (!esVisita && !nota && !pago) continue;
    hayAlgo = hayAlgo || !!(nota || expo || pago || fotos.length || obs.length);
    total += pago;
    b.push({ h2: `${s.hora ? s.hora + " · " : ""}${s.nombre}` });
    b.push({ nota: [s.lugar, s.alt != null ? fmt(s.alt) + " msnm" : "", s.lat != null ? `${s.lat.toFixed(4)}, ${s.lon.toFixed(4)}` : ""].filter(Boolean).join(" · ") });
    if (expo) b.push({ p: "Expuso: " + expo, jc: "left" });
    if (pago) b.push({ p: "Pagué: " + pesos(pago), jc: "left" });
    if (obs.length) { b.push({ h3: "Lo que observé" }); obs.forEach((o) => b.push({ li: o })); }
    b.push({ h3: "Mis notas" });
    if (nota) nota.split(/\n{2,}/).forEach((p) => b.push({ p: p.trim() }));
    else b.push({ nota: "Sin notas." });
    if (fotos.length) {
      b.push({ h3: "Fotografías" });
      for (const f of fotos) {
        numFoto.n++;
        b.push({ img: new Uint8Array(await f.blob.arrayBuffer()), ancho: f.w, alto: f.h, cm: 14 });
        b.push({ pie: `Figura ${numFoto.n}. ${f.pie || "[Pie de foto]"}` });
      }
    }
  }
  b.push({ h2: "Gastos del día" }, { p: "Total que registré: " + pesos(total), jc: "left" });
  if (!hayAlgo) aviso("Aún no hay notas ni fotos en este día; el Word saldrá casi vacío.");
  await entregar(Docx.crear(b), `mi-dia-${n}-${nombreArchivo(quien || "cuaderno")}.docx`);
}
async function exportarFotosDia(n) {
  const d = D.dias.find((x) => x.n === n);

  const archivos = [], pies = [`Fotos del día ${n} · ${d.fecha} de 2026 · ${d.tema}`, ""];
  let k = 0;
  for (const s of [...d.sitios, ...extras]) {
    const fotos = await BD.fotos(s.id);
    for (const f of fotos) {
      k++;
      const nombre = `dia${n}-${String(k).padStart(2, "0")}-${nombreArchivo(CORTO(s)).slice(0, 30)}.jpg`;
      archivos.push({ nombre, datos: new Uint8Array(await f.blob.arrayBuffer()) });
      pies.push(`${nombre}\t${s.nombre}\t${f.pie || ""}`);
    }
  }
  if (!k) return aviso("Este día todavía no tiene fotos.");
  archivos.push({ nombre: "pies-de-foto.txt", datos: "﻿" + pies.join("\r\n") });
  await entregar(Docx.zip(archivos, "application/zip"), `fotos-dia-${n}-viaje-generacional-21.zip`);
}
